<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 480" fill="none" font-family="Inter, 'Helvetica Neue', system-ui, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="48%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="screen" cx="50%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#16233c"/>
      <stop offset="100%" stop-color="#070b15"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- device -->
  <rect x="12" y="6" width="216" height="468" rx="38" fill="#0b1220" stroke="url(#brand)" stroke-width="2" filter="url(#shadow)"/>
  <rect x="22" y="16" width="196" height="448" rx="29" fill="url(#screen)"/>
  <rect x="94" y="26" width="52" height="11" rx="5.5" fill="#05080f"/>
  <!-- header -->
  <path d="M40 60 L52 76 M52 60 L40 76" stroke="url(#brand)" stroke-width="3.2" stroke-linecap="round"/>
  <text x="60" y="73" fill="#f0f4fa" font-size="14" font-weight="700">Xcelsior</text>
  <circle cx="198" cy="68" r="9" fill="#111c31" stroke="#22e0ff" stroke-opacity="0.35"/>
  <!-- wallet -->
  <rect x="36" y="92" width="168" height="68" rx="14" fill="#101a2e" stroke="#22e0ff" stroke-opacity="0.22"/>
  <text x="50" y="114" fill="#9aa7bd" font-size="10" letter-spacing="1">WALLET</text>
  <text x="50" y="143" fill="#f0f4fa" font-size="24" font-weight="700">$42.50</text>
  <rect x="148" y="127" width="44" height="20" rx="10" fill="url(#brand)"/>
  <text x="170" y="141" fill="#ffffff" font-size="10" font-weight="700" text-anchor="middle">Top up</text>
  <!-- running instances -->
  <text x="38" y="184" fill="#9aa7bd" font-size="10" letter-spacing="1">INSTANCES</text>
  <g>
    <rect x="36" y="192" width="168" height="44" rx="12" fill="#101a2e"/>
    <rect x="46" y="203" width="22" height="22" rx="6" fill="url(#brand)" opacity="0.9"/>
    <text x="78" y="212" fill="#f0f4fa" font-size="11" font-weight="600">RTX 4090</text>
    <text x="78" y="227" fill="#9aa7bd" font-size="10">$0.30/hr · spot</text>
    <circle cx="190" cy="214" r="4" fill="#34d399" filter="url(#glow)"/>
  </g>
  <g>
    <rect x="36" y="242" width="168" height="44" rx="12" fill="#101a2e"/>
    <rect x="46" y="253" width="22" height="22" rx="6" fill="#7c3aed" opacity="0.85"/>
    <text x="78" y="262" fill="#f0f4fa" font-size="11" font-weight="600">A100 80GB</text>
    <text x="78" y="277" fill="#9aa7bd" font-size="10">$1.42/hr · on-demand</text>
    <circle cx="190" cy="264" r="4" fill="#34d399" filter="url(#glow)"/>
  </g>
  <!-- live telemetry -->
  <rect x="36" y="296" width="168" height="92" rx="14" fill="#101a2e" stroke="#34d399" stroke-opacity="0.2"/>
  <text x="50" y="316" fill="#9aa7bd" font-size="10" letter-spacing="1">GPU UTILIZATION</text>
  <text x="190" y="316" fill="#34d399" font-size="11" font-weight="700" text-anchor="end">92%</text>
  <polyline points="50,368 66,356 80,360 94,340 108,346 122,330 136,336 150,322 164,328 178,318 190,322" stroke="url(#emerald)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- tab bar -->
  <rect x="36" y="404" width="168" height="44" rx="22" fill="#0e1729" stroke="#ffffff" stroke-opacity="0.06"/>
  <circle cx="66" cy="426" r="5" fill="#22e0ff"/>
  <circle cx="102" cy="426" r="4" fill="#9aa7bd" opacity="0.6"/>
  <circle cx="138" cy="426" r="4" fill="#9aa7bd" opacity="0.6"/>
  <circle cx="174" cy="426" r="4" fill="#9aa7bd" opacity="0.6"/>
  <!-- glass -->
  <rect x="22" y="16" width="196" height="448" rx="29" fill="url(#glass)"/>
</svg>

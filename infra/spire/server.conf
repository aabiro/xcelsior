# SPIRE server — Xcelsior worker identity (blueprint §19.2 / §19.3).
#
# Deployed by `docker compose -f infra/spire/docker-compose.spire.yml up`.
# Every admitted GPU host gets a node identity through x509pop attestation
# and a workload SVID of the exact shape the control plane verifies:
#
#     spiffe://xcelsior.ca/worker/host/<host_id>
#
# `control_plane.identity.parse_worker_spiffe_id` rejects anything else,
# so a certificate from another trust domain — or a workload in this one
# that is not a registered worker — cannot act as a GPU host.

# Started with -expandEnv (docker-compose.spire.yml), which fills ${...} below.
# The server uses the host network: it binds the mesh address only, and reaches
# Postgres on 127.0.0.1 (pg_hba already allows that; no Docker subnet rule).
server {
  bind_address    = "${SPIRE_BIND_ADDRESS}"
  # 8095: on prod-hetzner *:8081 and *:8091 are both held by other services.
  bind_port       = "8095"
  # Shared with the API container (group 10001) so it can mint join tokens
  # without Docker access; see docker-compose.spire-server.yml.
  socket_path     = "/run/xcelsior-spire/api.sock"
  trust_domain    = "xcelsior.ca"
  data_dir        = "/opt/spire/data/server"
  log_level       = "INFO"

  # Short-lived SVIDs are the point: a credential lifted off a host is
  # useless within the hour, without any revocation round trip.
  # Agents attest once with a single-use join token, then renew their own
  # identity. An agent SVID cannot outlive the CA, so a 24h CA stranded any host
  # switched off for a day. 60-day CA, 30-day agent identity: a host can be off
  # for a month; past that, `install.sh --update` enrolls it again.
  ca_ttl                 = "1440h"
  agent_ttl              = "720h"
  default_x509_svid_ttl  = "1h"
  default_jwt_svid_ttl   = "5m"

  ca_subject {
    country      = ["CA"]
    organization = ["Xcelsior"]
    common_name  = "Xcelsior SPIRE CA"
  }
}

plugins {
  # PostgreSQL keeps the registration entries in the same failure domain
  # as the rest of the control plane, and survives a server restart.
  # Swap to sqlite3 only for a single-node evaluation deploy.
  DataStore "sql" {
    plugin_data {
      database_type     = "postgres"
      connection_string = "${SPIRE_DATASTORE_DSN}"
    }
  }

  # Hosts attest once with a single-use join token minted by
  # POST /api/hosts/{host_id}/enrollment, then renew their own identity
  # (agent_ttl above; `install.sh --update` enrolls a host again after that).
  NodeAttestor "join_token" {
    plugin_data {}
  }

  # A long-lived Xcelsior root signs SPIRE's rotating CA, so the agent gateway
  # (nginx/agent-xcelsior.conf) trusts one stable certificate instead of a
  # bundle that changes as the CA rotates. Proven end to end in #67.
  UpstreamAuthority "disk" {
    plugin_data {
      cert_file_path = "/opt/spire/conf/server/upstream-root.crt"
      key_file_path  = "/opt/spire/conf/server/upstream-root.key"
    }
  }
  KeyManager "disk" {
    plugin_data {
      keys_path = "/opt/spire/data/server/keys.json"
    }
  }

}

health_checks {
  listener_enabled = true
  bind_address     = "127.0.0.1"
  bind_port        = "8096"
  live_path        = "/live"
  ready_path       = "/ready"
}

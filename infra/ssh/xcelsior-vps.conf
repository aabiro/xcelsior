# Snippet for ~/.ssh/config. The Headscale VPS (hs.xcelsior.ca / 45.76.3.128)
# must not be the only path to the API VPS (149.28.121.61). When Headscale is
# down, `ProxyJump aarynfans-root` strands SSH to the API box even if that box
# is still up.

Host aarynfans-root vps-root root-45 45.76.3.128
    HostName 45.76.3.128
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    PasswordAuthentication no
    ConnectTimeout 8

Host xcelsior-api xcelsior-vps-direct
    HostName 149.28.121.61
    User linuxuser
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump none
    PasswordAuthentication no
    ConnectTimeout 8

# Snippet for ~/.ssh/config. Since 2026-10-07 production is one Hetzner host,
# 46.225.20.97, which carries everything the two Vultr boxes did: the API,
# Headscale, the hs.xcelsior.ca front, and the aarynfans stack. Neither
# 149.28.121.61 nor 45.76.3.128 is in service.
#
# Reach it directly, never through the tailnet: when Headscale is down the
# tailnet path is down with it, and so is any SSH that depends on it.

Host aarynfans-root vps-root xcelsior-root
    HostName 46.225.20.97
    User root
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump none
    PasswordAuthentication no
    ConnectTimeout 8

Host xcelsior-api xcelsior-vps-direct
    HostName 46.225.20.97
    User linuxuser
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ProxyJump none
    PasswordAuthentication no
    ConnectTimeout 8

groups:
  - name: xcelsior.availability
    rules:
      - alert: XcelsiorApiUnavailable
        expr: xcelsior:api_available < 1
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: No Xcelsior API replica is scrapeable
          description: Both green and blue API targets have been unavailable for two minutes.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#api-and-worker-availability

      - alert: XcelsiorMcpUnavailable
        expr: xcelsior:mcp_available < 1
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: No Xcelsior MCP replica is scrapeable
          description: Both MCP targets have been unavailable for five minutes.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#api-and-worker-availability

      - alert: XcelsiorWorkerUnavailable
        expr: |
          max by (service) (xcelsior_service_expected) == 1
          and on (service)
          max by (service) (xcelsior_service_heartbeat_fresh_replicas) < 1
          and on () xcelsior:api_available == 1
        for: 3m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Xcelsior {{ $labels.service }} worker has no fresh replica
          description: The service is enabled but no durable heartbeat has been observed inside the configured freshness window.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#api-and-worker-availability

      - alert: XcelsiorControlPlaneMetricsMissing
        expr: absent(xcelsior_control_plane_metrics_available)
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Durable control-plane metrics are missing
          description: Prometheus cannot find the explicit availability signal, so zero-valued operational gauges cannot be trusted.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#telemetry-freshness

      - alert: XcelsiorControlPlaneMetricsUnavailable
        expr: max(xcelsior_control_plane_metrics_available) < 1
        for: 3m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Durable control-plane metric queries are failing
          description: The API is scrapeable but cannot read the PostgreSQL operational state.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#telemetry-freshness

      - alert: XcelsiorControlPlaneMetricsStale
        expr: xcelsior:control_plane_metrics_age_seconds > 180
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Durable control-plane metrics are stale
          description: No successful durable metrics snapshot has completed in more than three minutes.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#telemetry-freshness

  - name: xcelsior.queue-and-billing
    rules:
      - alert: XcelsiorQueueBacklogHigh
        expr: xcelsior:queue_depth > 100
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Xcelsior queue depth is high
          description: More than 100 jobs have remained queued for ten minutes.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#queue-backlog-and-age

      - alert: XcelsiorQueueOldestJobStale
        expr: xcelsior:queue_oldest_age_seconds > 900
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: The oldest queued job has waited over 15 minutes
          description: Inspect scheduler heartbeats, capacity filters, and durable queue reasons before changing job state.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#queue-backlog-and-age

      - alert: XcelsiorBillingMetersMissing
        expr: max(xcelsior_billing_missing_meters) > 0
        for: 1m
        labels:
          severity: critical
          owner: billing
        annotations:
          summary: Billable terminal attempts are missing usage meters
          description: GPU work may be unbilled. Preserve ledger evidence and use the billing reconciler; do not hand-edit wallets or meters.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#billing-meter-invariants

      - alert: XcelsiorBillingMetersOpenAfterTerminal
        expr: max(xcelsior_billing_open_terminal_meters) > 0
        for: 5m
        labels:
          severity: critical
          owner: billing
        annotations:
          summary: Usage meters remain open after terminal attempts
          description: Cost settlement is incomplete for at least one terminal attempt.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#billing-meter-invariants

  - name: xcelsior.control-plane-invariants
    rules:
      - alert: XcelsiorStalePlacementLease
        expr: max(xcelsior_stale_active_leases) + max(xcelsior_stale_offered_leases) > 0
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Expired placement leases remain live
          description: A lease expiry sweep may be stalled. Verify fencing before any manual requeue or stop action.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#leases-fences-and-observations

      - alert: XcelsiorStaleFenceFinding
        expr: max(xcelsior_reconciliation_stale_fence_findings) > 0
        for: 2m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Reconciliation found workload running behind a stale fence
          description: Do not reassign strict work until host and storage fencing are definitive.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#leases-fences-and-observations

      - alert: XcelsiorHostObservationsStale
        expr: max(xcelsior_stale_host_observations) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Admitted hosts have stale or missing observations
          description: One or more admitted hosts are beyond the configured observation freshness window.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#leases-fences-and-observations

      - alert: XcelsiorReconciliationBacklog
        expr: max(xcelsior_reconciliation_queue_depth) > 100 or max(xcelsior_reconciliation_oldest_due_age_seconds) > 300
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Reconciliation work is accumulating
          description: The due queue is deep or its oldest item is more than five minutes late.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#leases-fences-and-observations

      - alert: XcelsiorScheduledTaskFailure
        expr: max(xcelsior_scheduled_task_failures) > 0
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: A durable scheduled task's latest run failed
          description: Inspect scheduled_tasks.last_error and repair the dependency before retrying.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#api-and-worker-availability

  - name: xcelsior.outbox-and-projections
    rules:
      - alert: XcelsiorOutboxBacklog
        expr: xcelsior:outbox_backlog > 100 or xcelsior:outbox_oldest_pending_age_seconds > 300
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Transactional outbox delivery is behind
          description: The unpublished outbox is deep or its oldest event is more than five minutes old.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

      - alert: XcelsiorOutboxDeadLetters
        expr: max(xcelsior_outbox_dead_letters) > 0
        for: 1m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Transactional outbox has dead-lettered events
          description: Preserve delivery evidence; never mark events delivered without sink proof.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

      - alert: XcelsiorProjectionMetricsUnavailable
        expr: absent(xcelsior_projection_metrics_available) or max(xcelsior_projection_metrics_available) < 1
        for: 5m
        labels:
          severity: warning
          owner: data
        annotations:
          summary: Projection delivery metrics are unavailable
          description: Projection zero values cannot be trusted until the durable health snapshot succeeds.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

      - alert: XcelsiorProjectionMetricsStale
        expr: time() - max(xcelsior_projection_metrics_last_success_timestamp_seconds) > 180
        for: 2m
        labels:
          severity: warning
          owner: data
        annotations:
          summary: Projection delivery metrics are stale
          description: No successful projection snapshot has completed in more than three minutes.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

      - alert: XcelsiorProjectionBacklog
        expr: xcelsior:projection_pending_deliveries > 100 or max(xcelsior_projection_oldest_pending_seconds) > 300 or max(xcelsior_projection_outbox_unprepared) > 100
        for: 5m
        labels:
          severity: warning
          owner: data
        annotations:
          summary: Projection delivery is behind
          description: Pending receipts, old receipts, or unprepared fan-out work exceed the operational threshold.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

      - alert: XcelsiorProjectionDeadLetters
        expr: xcelsior:projection_dead_letters > 0
        for: 1m
        labels:
          severity: critical
          owner: data
        annotations:
          summary: Projection delivery has dead letters
          description: At least one projection sink exhausted delivery attempts.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#outbox-and-projectors

  - name: xcelsior.postgres-and-backups
    rules:
      - alert: XcelsiorPostgresExporterUnavailable
        expr: up{job="postgres"} < 1
        for: 3m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: PostgreSQL exporter is unavailable
          description: Database capacity and health signals are missing; verify exporter credentials and PostgreSQL reachability.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#postgresql-capacity

      - alert: XcelsiorPostgresConnectionsHigh
        expr: xcelsior:postgres_connections_utilization > 0.80
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: PostgreSQL connection utilization exceeds 80 percent
          description: Identify leaking or oversized pools before max_connections is exhausted.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#postgresql-capacity

      - alert: XcelsiorPostgresDeadlocks
        expr: sum(increase(pg_stat_database_deadlocks[15m])) > 0
        for: 1m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: PostgreSQL reported a deadlock
          description: Correlate the affected database with application traces and lock-order logs.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#postgresql-capacity

      - alert: XcelsiorHostFilesystemLow
        expr: xcelsior:host_filesystem_available_ratio < 0.15
        for: 10m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Host filesystem has less than 15 percent free
          description: Verify the PostgreSQL, Prometheus, Loki, and Tempo data paths before deleting any retained evidence.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#postgresql-capacity

      - alert: XcelsiorBackupMetricMissing
        expr: up{job="node"} == 1 and absent(xcelsior_backup_last_success_timestamp_seconds)
        for: 15m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: Database backup freshness metric is missing
          description: Node exporter is healthy but the backup textfile collector has never reported a success timestamp.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

      - alert: XcelsiorBackupStale
        expr: time() - xcelsior_backup_last_success_timestamp_seconds > 93600
        for: 10m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: No successful PostgreSQL backup in 26 hours
          description: Check the backup timer and repository without overwriting the last known-good backup.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

      - alert: XcelsiorBackupFailedSinceLastSuccess
        expr: xcelsior_backup_last_failure_timestamp_seconds > xcelsior_backup_last_success_timestamp_seconds
        for: 5m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: The latest PostgreSQL backup attempt failed
          description: A failure timestamp is newer than the last successful backup.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

      - alert: XcelsiorRestoreDrillMetricMissing
        expr: up{job="node"} == 1 and absent(xcelsior_restore_last_success_timestamp_seconds)
        for: 1h
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Restore-drill freshness metric is missing
          description: The restore drill has not published a successful validation timestamp.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

      - alert: XcelsiorRestoreDrillStale
        expr: time() - xcelsior_restore_last_success_timestamp_seconds > 3024000
        for: 1h
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: No successful restore drill in 35 days
          description: Backups are not proven recoverable until an isolated restore drill succeeds.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

      - alert: XcelsiorRestoreDrillFailedSinceLastSuccess
        expr: xcelsior_restore_last_failure_timestamp_seconds > xcelsior_restore_last_success_timestamp_seconds
        for: 10m
        labels:
          severity: critical
          owner: platform
        annotations:
          summary: The latest restore drill failed
          description: A restore failure timestamp is newer than the last successful drill.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#backup-and-restore-freshness

  - name: xcelsior.telemetry-stack
    rules:
      - alert: XcelsiorTelemetryComponentUnavailable
        expr: up{job=~"otel-collector|alertmanager|loki|tempo"} < 1
        for: 5m
        labels:
          severity: warning
          owner: platform
        annotations:
          summary: Telemetry component {{ $labels.job }} is unavailable
          description: Logs, traces, or notifications may be incomplete while this target is down.
          runbook_url: https://github.com/aabiro/xcelsior/blob/main/infra/observability/RUNBOOK.md#telemetry-freshness

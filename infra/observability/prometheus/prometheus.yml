global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s
  external_labels:
    cluster: xcelsior

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alert_relabel_configs:
    - action: replace
      target_label: cluster
      replacement: xcelsior
  alertmanagers:
    - scheme: http
      static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: xcelsior-api
    metrics_path: /metrics/prometheus
    static_configs:
      - targets:
          - host.docker.internal:9500
        labels:
          replica: green
      - targets:
          - host.docker.internal:9501
        labels:
          replica: blue

  - job_name: xcelsior-mcp
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8770
        labels:
          replica: green
      - targets:
          - host.docker.internal:8771
        labels:
          replica: blue

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: otel-received-metrics
    static_configs:
      - targets:
          - otel-collector:8889

  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

global:
  resolve_timeout: 5m

route:
  receiver: xcelsior-default
  group_by:
    - alertname
    - cluster
    - owner
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: xcelsior-critical
      matchers:
        - severity="critical"
      group_wait: 10s
      repeat_interval: 30m
    - receiver: xcelsior-warning
      matchers:
        - severity="warning"
      repeat_interval: 4h

inhibit_rules:
  - source_matchers:
      - alertname="XcelsiorApiUnavailable"
      - severity="critical"
    target_matchers:
      - alertname=~"XcelsiorControlPlaneMetrics.*|XcelsiorProjectionMetrics.*"
    equal:
      - cluster
  - source_matchers:
      - alertname="XcelsiorPostgresExporterUnavailable"
      - severity="critical"
    target_matchers:
      - alertname=~"XcelsiorPostgresConnectionsHigh|XcelsiorPostgresDeadlocks"
    equal:
      - cluster

# The checked-in receivers deliberately have no external integration, so a
# repository checkout cannot leak alerts or credentials.  Production points
# XCELSIOR_ALERTMANAGER_CONFIG_PATH at a secret-managed config based on
# alertmanager.routing.example.yml.
receivers:
  - name: xcelsior-default
  - name: xcelsior-critical
  - name: xcelsior-warning

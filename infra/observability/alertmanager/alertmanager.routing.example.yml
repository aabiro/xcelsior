global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by:
    - alertname
    - cluster
    - owner
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: paging-webhook
      matchers:
        - severity="critical"
      group_wait: 10s
      repeat_interval: 30m

receivers:
  - name: operations-webhook
    webhook_configs:
      - url: https://alerts.example.invalid/xcelsior/operations
        send_resolved: true
        max_alerts: 50
  - name: paging-webhook
    webhook_configs:
      - url: https://alerts.example.invalid/xcelsior/paging
        send_resolved: true
        max_alerts: 50

# Copy this file outside the repository, replace the example.invalid URLs
# with secret-managed receiver URLs, restrict it to the deploy user, and set:
# XCELSIOR_ALERTMANAGER_CONFIG_PATH=/absolute/path/to/alertmanager.yml

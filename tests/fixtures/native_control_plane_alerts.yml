  - series: xcelsior_control_plane_metrics_last_success_timestamp_seconds{job="xcelsior-api",instance="api"}
    values: 0+60x20
  - series: xcelsior_commands_dead_lettered{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_queue_oldest_age_seconds{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_reconciliation_critical_findings{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_service_heartbeat_fresh_replicas{job="xcelsior-api",instance="api",service="scheduler"}

rule_files:
- ../../api/infra/observability/prometheus/native-control-plane-rules.yml
evaluation_interval: 1m
tests:
- name: healthy idle site produces no operational alerts
  interval: 1m
  input_series:
  - series: up{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_control_plane_metrics_available{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_control_plane_metrics_last_success_timestamp_seconds{job="xcelsior-api",instance="api"}
    values: 0+60x20
  - series: xcelsior_commands_dead_lettered{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_queue_oldest_age_seconds{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_reconciliation_critical_findings{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_service_heartbeat_fresh_replicas{job="xcelsior-api",instance="api",service="scheduler"}
    values: 1x20
  - series: xcelsior_billing_missing_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_billing_open_terminal_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_outbox_dead_letters{job="xcelsior-api",instance="api"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 10m
    alertname: XcelsiorApiUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorControlPlaneMetricsUnavailable
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorControlPlaneMetricsStale
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorWorkerCommandDeadLettered
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorQueueDelayed
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorReconciliationCriticalFindings
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorServiceHeartbeatMissing
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorBillingInvariantViolation
    exp_alerts: []
  - eval_time: 10m
    alertname: XcelsiorEventDeliveryDeadLettered
    exp_alerts: []
- name: XcelsiorApiUnavailable fires with native raw metrics
  interval: 1m
  input_series:
  - series: up{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_control_plane_metrics_available{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_control_plane_metrics_last_success_timestamp_seconds{job="xcelsior-api",instance="api"}
    values: 0+60x20
  - series: xcelsior_commands_dead_lettered{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_queue_oldest_age_seconds{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_reconciliation_critical_findings{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_service_heartbeat_fresh_replicas{job="xcelsior-api",instance="api",service="scheduler"}
    values: 1x20
  - series: xcelsior_billing_missing_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_billing_open_terminal_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_outbox_dead_letters{job="xcelsior-api",instance="api"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 5m
    alertname: XcelsiorApiUnavailable
    exp_alerts:
    - exp_labels:
        job: xcelsior-api
        instance: api
        severity: critical
        platform: xcelsior
        component: control-plane
        owner: platform
      exp_annotations:
        summary: Xcelsior API cannot be scraped
        description: Check API readiness and the native Prometheus target before restarting
          services.
- name: XcelsiorWorkerCommandDeadLettered fires with native raw metrics
  interval: 1m
  input_series:
  - series: up{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_control_plane_metrics_available{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_control_plane_metrics_last_success_timestamp_seconds{job="xcelsior-api",instance="api"}
    values: 0+60x20
  - series: xcelsior_commands_dead_lettered{job="xcelsior-api",instance="api"}
    values: 1x20
  - series: xcelsior_queue_oldest_age_seconds{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_reconciliation_critical_findings{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_service_heartbeat_fresh_replicas{job="xcelsior-api",instance="api",service="scheduler"}
    values: 1x20
  - series: xcelsior_billing_missing_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_billing_open_terminal_meters{job="xcelsior-api",instance="api"}
    values: '0x20'
  - series: xcelsior_outbox_dead_letters{job="xcelsior-api",instance="api"}
    values: '0x20'
  alert_rule_test:
  - eval_time: 5m
    alertname: XcelsiorWorkerCommandDeadLettered
    exp_alerts:
    - exp_labels:
        job: xcelsior-api
        instance: api
        severity: warning
        platform: xcelsior
        component: control-plane
        owner: platform
      exp_annotations:
        summary: Worker commands exhausted delivery or failed permanently
        description: Inspect command error codes, worker sessions and claim history.
          Preserve failed rows.

# Staging overlay for Xcelsior.
#
# Usage:
#   docker compose --env-file .env.staging -f docker-compose.yml -f docker-compose.staging.yml up -d api
# or:
#   ./scripts/run_staging_compose.sh up -d api
#
# Loads crypto/session secrets from .env.staging (generated / merged from
# .env.staging.secrets). Forces XCELSIOR_ENV=staging so enforcement stays on
# but staging retains its audited agent escape hatch.

services:
  api:
    env_file:
      - .env.staging
    environment:
      XCELSIOR_ENV: staging
      XCELSIOR_AGENT_HOST_TOKENS: ${XCELSIOR_AGENT_HOST_TOKENS:-allow}
      # Fixed here, not taken from .env.staging. With a bind allowlist that
      # includes a tailnet address, this is all that keeps `/agent/*` and
      # `/host` from every peer the bind admits — and api.py defaults to
      # `allow`. It used to rest on a gitignored file, which a fresh checkout
      # does not have and which nothing in the repository could check.
      XCELSIOR_AGENT_PUBLIC_INGRESS: deny

  api-blue:
    env_file:
      - .env.staging
    environment:
      XCELSIOR_ENV: staging
      XCELSIOR_AGENT_HOST_TOKENS: ${XCELSIOR_AGENT_HOST_TOKENS:-allow}
      # Fixed here, not taken from .env.staging. With a bind allowlist that
      # includes a tailnet address, this is all that keeps `/agent/*` and
      # `/host` from every peer the bind admits — and api.py defaults to
      # `allow`. It used to rest on a gitignored file, which a fresh checkout
      # does not have and which nothing in the repository could check.
      XCELSIOR_AGENT_PUBLIC_INGRESS: deny

  bg-worker:
    env_file:
      - .env.staging
    # The full worker registers billing_cycle and mail. Staging runs only the
    # Slurm shadow loop here (blueprint 2.3): place jobs that name a cluster,
    # submit them, poll, and once an hour record yesterday's drift between the
    # shadow ledger and the cluster's accounting. It never charges and never
    # sends mail. The placement is the narrow tick: it claims only jobs that
    # name hpc_cluster_id, because this database is shared with the dev pool,
    # whose host jobs staging must neither place nor delay.
    command:
      - python
      - -c
      - |
        import logging
        import time

        logging.basicConfig(
            level=logging.INFO,
            format="%(asctime)s %(levelname)s [slurm-poll] %(message)s",
        )
        from control_plane.scheduler.config import SchedulerConfig
        from control_plane.scheduler.service import SchedulerService
        from slurm_reconciler import reconcile_due_clusters, report_shadow_drift
        from slurm_submitter import submit_due

        placer = SchedulerService(SchedulerConfig.from_env())
        next_drift = 0.0
        while True:
            for step, fn in (
                ("place", placer.tick_slurm_only),
                ("submit", submit_due),
                ("poll", reconcile_due_clusters),
            ):
                try:
                    fn()
                except Exception:
                    logging.exception("slurm %s failed", step)
            if time.monotonic() >= next_drift:
                try:
                    report_shadow_drift()
                except Exception:
                    logging.exception("slurm drift report failed")
                next_drift = time.monotonic() + 3600
            time.sleep(30)
    environment:
      XCELSIOR_ENV: staging
      # Places jobs that name a cluster, through tick_slurm_only only. The
      # API and every other staging service leave it unset.
      XCELSIOR_SLURM_PLACEMENT: "1"
      # Alliance names are built in. xcl-local is this file, already in the image.
      # Without it the poll records unknown_profile and writes no shadow row.
      XCELSIOR_SLURM_PROFILES_FILE: /app/hpc/slurm-local/conf/xcelsior-profiles.json
    healthcheck:
      test: ["CMD", "python", "-c", "import slurm_reconciler"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # Renamed since this overlay was written: the base compose has
  # `scheduler-worker`. Naming a service the base does not define does not
  # error — Compose *creates* it, so staging would have started a phantom
  # service with no image and the real scheduler would have run without
  # XCELSIOR_ENV=staging, which is the one thing this overlay exists to set.
  scheduler-worker:
    env_file:
      - .env.staging
    environment:
      XCELSIOR_ENV: staging

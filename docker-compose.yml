# ── Shared API environment (used by both api and api-blue) ────────────
x-api-environment: &api-env
  XCELSIOR_ENV: ${XCELSIOR_ENV:-production}
  XCELSIOR_API_TOKEN: ${XCELSIOR_API_TOKEN}
  XCELSIOR_PERSISTENT_AUTH: ${XCELSIOR_PERSISTENT_AUTH:-true}
  XCELSIOR_AUTH_RATE_LIMIT_REQUESTS: ${XCELSIOR_AUTH_RATE_LIMIT_REQUESTS:-10}
  XCELSIOR_WEBAUTHN_RP_ID: ${XCELSIOR_WEBAUTHN_RP_ID:-xcelsior.ca}
  XCELSIOR_WEBAUTHN_ORIGIN: ${XCELSIOR_WEBAUTHN_ORIGIN:-https://xcelsior.ca}
  XCELSIOR_DB_BACKEND: ${XCELSIOR_DB_BACKEND:-postgres}
  XCELSIOR_DB_PATH: /data/xcelsior.db
  XCELSIOR_AUTH_DB_PATH: /data/auth.db
  XCELSIOR_BILLING_DB_PATH: /data/xcelsior_billing.db
  XCELSIOR_REPUTATION_DB_PATH: /data/xcelsior_reputation.db
  XCELSIOR_INFERENCE_DB_PATH: /data/inference.db
  XCELSIOR_CHAT_DB_PATH: /data/chat.db
  XCELSIOR_TRANSPARENCY_DB_PATH: /data/xcelsior_transparency.db
  XCELSIOR_SLA_DB: /data/xcelsior_sla.db
  XCELSIOR_BTC_DB: /data/xcelsior_btc.db
  XCELSIOR_STRIPE_DB: /data/xcelsior_stripe.db
  XCELSIOR_HOSTS_FILE: /data/hosts.json
  XCELSIOR_JOBS_FILE: /data/jobs.json
  XCELSIOR_BILLING_FILE: /data/billing.json
  XCELSIOR_MARKETPLACE_FILE: /data/marketplace.json
  XCELSIOR_AUTOSCALE_FILE: /data/autoscale_pool.json
  XCELSIOR_SPOT_PRICES_FILE: /data/spot_prices.json
  XCELSIOR_COMPUTE_SCORES_FILE: /data/compute_scores.json
  XCELSIOR_LOG_FILE: /data/xcelsior.log
  XCELSIOR_POSTGRES_DSN: postgresql://xcelsior:${XCELSIOR_POSTGRES_PASSWORD:-xcelsior}@127.0.0.1:5432/${XCELSIOR_POSTGRES_DB:-xcelsior}
  XCELSIOR_DUAL_READ_FROM: ${XCELSIOR_DUAL_READ_FROM:-postgres}
  XCELSIOR_RATE_LIMIT_REQUESTS: ${XCELSIOR_RATE_LIMIT_REQUESTS:-120}
  XCELSIOR_RATE_LIMIT_WINDOW_SEC: ${XCELSIOR_RATE_LIMIT_WINDOW_SEC:-60}
  # Serverless rate-limit degradation policy (companion §2.3/§5.5): what
  # happens when the global Redis limiter is unavailable. Production must
  # declare it (undefined fails /readyz); no silent per-process fallback.
  XCELSIOR_SERVERLESS_RATE_LIMIT_POLICY: ${XCELSIOR_SERVERLESS_RATE_LIMIT_POLICY:-strict-deny}
  # Track A canary ownership must be identical in the API and scheduler.
  # The API still runs legacy queue walkers during rollout; without these
  # values it cannot skip jobs owned by the transactional scheduler.
  XCELSIOR_SCHEDULER_MODE: ${XCELSIOR_SCHEDULER_MODE:-paused}
  XCELSIOR_SCHEDULER_CANARY_GPU_MODELS: ${XCELSIOR_SCHEDULER_CANARY_GPU_MODELS:-}
  XCELSIOR_SCHEDULER_CANARY_HOSTS: ${XCELSIOR_SCHEDULER_CANARY_HOSTS:-}
  XCELSIOR_SCHEDULER_CLAIMS_ENABLED: ${XCELSIOR_SCHEDULER_CLAIMS_ENABLED:-true}
  # Phase 5: hosts allowed to speak the /agent/v2 fenced protocol
  # (csv of host_ids, or "*"). Empty = every agent stays on v1.
  XCELSIOR_AGENT_V2_HOSTS: ${XCELSIOR_AGENT_V2_HOSTS:-}
  XCELSIOR_PLATFORM_CUT: ${XCELSIOR_PLATFORM_CUT:-0.20}
  XCELSIOR_CAD_USD_RATE: ${XCELSIOR_CAD_USD_RATE:-0.73}
  XCELSIOR_SMTP_HOST: ${XCELSIOR_SMTP_HOST:-}
  XCELSIOR_SMTP_PORT: ${XCELSIOR_SMTP_PORT:-587}
  XCELSIOR_SMTP_USER: ${XCELSIOR_SMTP_USER:-}
  XCELSIOR_SMTP_PASS: ${XCELSIOR_SMTP_PASS:-}
  XCELSIOR_EMAIL_FROM: ${XCELSIOR_EMAIL_FROM:-}
  XCELSIOR_EMAIL_TO: ${XCELSIOR_EMAIL_TO:-}
  XCELSIOR_TG_TOKEN: ${XCELSIOR_TG_TOKEN:-}
  XCELSIOR_TG_CHAT_ID: ${XCELSIOR_TG_CHAT_ID:-}
  # OAuth 2.0 Authorization Server
  XCELSIOR_OAUTH_ACCESS_TTL_SEC: ${XCELSIOR_OAUTH_ACCESS_TTL_SEC:-900}
  XCELSIOR_OAUTH_REFRESH_TTL_SEC: ${XCELSIOR_OAUTH_REFRESH_TTL_SEC:-2592000}
  XCELSIOR_OAUTH_CODE_TTL_SEC: ${XCELSIOR_OAUTH_CODE_TTL_SEC:-300}
  XCELSIOR_OAUTH_DEVICE_TTL_SEC: ${XCELSIOR_OAUTH_DEVICE_TTL_SEC:-900}
  XCELSIOR_OAUTH_DEVICE_INTERVAL_SEC: ${XCELSIOR_OAUTH_DEVICE_INTERVAL_SEC:-5}
  XCELSIOR_OAUTH_CLIENT_CREDENTIALS_TTL_SEC: ${XCELSIOR_OAUTH_CLIENT_CREDENTIALS_TTL_SEC:-900}
  XCELSIOR_OAUTH_ACCESS_TOKEN_PREFIX: ${XCELSIOR_OAUTH_ACCESS_TOKEN_PREFIX:-xoa_}
  XCELSIOR_OAUTH_JWT_SECRET: ${XCELSIOR_OAUTH_JWT_SECRET:-}
  XCELSIOR_OAUTH_JWT_KEYS_JSON: ${XCELSIOR_OAUTH_JWT_KEYS_JSON:-}
  XCELSIOR_OAUTH_ACTIVE_KID: ${XCELSIOR_OAUTH_ACTIVE_KID:-default}
  XCELSIOR_OAUTH_ISSUER: ${XCELSIOR_OAUTH_ISSUER:-}
  XCELSIOR_OAUTH_AUDIENCE: ${XCELSIOR_OAUTH_AUDIENCE:-xcelsior-api}
  XCELSIOR_AUTH_CACHE_BACKEND: ${XCELSIOR_AUTH_CACHE_BACKEND:-redis}
  XCELSIOR_AUTH_REDIS_URL: ${XCELSIOR_AUTH_REDIS_URL:-redis://localhost:6379/0}
  XCELSIOR_AUTH_CACHE_PREFIX: ${XCELSIOR_AUTH_CACHE_PREFIX:-xcelsior:oauth}
  XCELSIOR_API_KEY_SUNSET_DATE: ${XCELSIOR_API_KEY_SUNSET_DATE:-2026-07-07}
  # OAuth providers (third-party)
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  HUGGINGFACE_CLIENT_ID: ${HUGGINGFACE_CLIENT_ID:-}
  HUGGINGFACE_CLIENT_SECRET: ${HUGGINGFACE_CLIENT_SECRET:-}
  # Stripe Connect
  XCELSIOR_STRIPE_MODE: ${XCELSIOR_STRIPE_MODE:-sandbox}
  XCELSIOR_STRIPE_SECRET_KEY: ${XCELSIOR_STRIPE_SECRET_KEY:-}
  XCELSIOR_STRIPE_SANDBOX_SECRET_KEY: ${XCELSIOR_STRIPE_SANDBOX_SECRET_KEY:-}
  XCELSIOR_STRIPE_SANDBOX_WEBHOOK_SECRET: ${XCELSIOR_STRIPE_SANDBOX_WEBHOOK_SECRET:-}
  XCELSIOR_PLATFORM_FEE_CENTS: ${XCELSIOR_PLATFORM_FEE_CENTS:-200}
  XCELSIOR_STRIPE_WEBHOOK_SECRET: ${XCELSIOR_STRIPE_WEBHOOK_SECRET:-}
  # PayPal
  PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
  PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
  PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
  PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}
  PAYPAL_PARTNER_ATTRIBUTION_ID: ${PAYPAL_PARTNER_ATTRIBUTION_ID:-}
  PAYPAL_PLATFORM_MERCHANT_ID: ${PAYPAL_PLATFORM_MERCHANT_ID:-}
  PAYPAL_PLATFORM_PAYEE_EMAIL: ${PAYPAL_PLATFORM_PAYEE_EMAIL:-}
  PAYPAL_PARTNER_MERCHANT_ID: ${PAYPAL_PARTNER_MERCHANT_ID:-}
  # Twilio (SMS 2FA) — without these the SMS MFA option returns 503 "not configured"
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
  TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
  # Bitcoin Deposits
  XCELSIOR_BTC_ENABLED: ${XCELSIOR_BTC_ENABLED:-false}
  XCELSIOR_BTC_RPC_HOST: ${XCELSIOR_BTC_RPC_HOST:-127.0.0.1}
  XCELSIOR_BTC_RPC_PORT: ${XCELSIOR_BTC_RPC_PORT:-8332}
  XCELSIOR_BTC_RPC_USER: ${XCELSIOR_BTC_RPC_USER:-}
  XCELSIOR_BTC_RPC_PASS: ${XCELSIOR_BTC_RPC_PASS:-}
  XCELSIOR_BTC_CONFIRMATIONS: ${XCELSIOR_BTC_CONFIRMATIONS:-3}
  XCELSIOR_BTC_DEPOSIT_EXPIRY: ${XCELSIOR_BTC_DEPOSIT_EXPIRY:-1800}
  # Lightning Network Deposits (via clnrest over Headscale)
  XCELSIOR_LN_ENABLED: ${XCELSIOR_LN_ENABLED:-false}
  XCELSIOR_LN_CLNREST_URL: ${XCELSIOR_LN_CLNREST_URL:-https://127.0.0.1:3010}
  XCELSIOR_LN_RUNE: ${XCELSIOR_LN_RUNE:-}
  XCELSIOR_LN_INVOICE_EXPIRY: ${XCELSIOR_LN_INVOICE_EXPIRY:-600}
  XCELSIOR_LN_DB_PATH: /data/xcelsior_ln.db
  XCELSIOR_LN_MIN_CAD: ${XCELSIOR_LN_MIN_CAD:-1}
  XCELSIOR_LN_MAX_CAD: ${XCELSIOR_LN_MAX_CAD:-1000}
  # SLA / Chat / Inference / Slurm
  XCELSIOR_SLURM_MAP: /data/slurm_jobs.json
  XCELSIOR_BASE_URL: ${XCELSIOR_BASE_URL:-https://xcelsior.ca}
  XCELSIOR_WEB_PUSH_VAPID_PUBLIC_KEY: ${XCELSIOR_WEB_PUSH_VAPID_PUBLIC_KEY:-}
  XCELSIOR_WEB_PUSH_VAPID_PRIVATE_KEY: ${XCELSIOR_WEB_PUSH_VAPID_PRIVATE_KEY:-}
  XCELSIOR_WEB_PUSH_VAPID_SUBJECT: ${XCELSIOR_WEB_PUSH_VAPID_SUBJECT:-mailto:hello@xcelsior.ca}
  XCELSIOR_WEB_PUSH_STALE_AFTER_DAYS: ${XCELSIOR_WEB_PUSH_STALE_AFTER_DAYS:-30}
  XCELSIOR_WEB_PUSH_REVOKED_RETENTION_DAYS: ${XCELSIOR_WEB_PUSH_REVOKED_RETENTION_DAYS:-30}
  XCELSIOR_NOTIFICATION_RETENTION_DAYS: ${XCELSIOR_NOTIFICATION_RETENTION_DAYS:-30}
  # Privacy erasure references and optional PostHog deletion credentials.
  # Values are injected by Compose from the deploy environment; never commit
  # the reference secret or personal API key.
  XCELSIOR_PRIVACY_REFERENCE_SECRET: ${XCELSIOR_PRIVACY_REFERENCE_SECRET:-}
  XCELSIOR_PRIVACY_DELETION_DEADLINE_DAYS: ${XCELSIOR_PRIVACY_DELETION_DEADLINE_DAYS:-30}
  XCELSIOR_POSTHOG_PERSONAL_API_KEY: ${XCELSIOR_POSTHOG_PERSONAL_API_KEY:-}
  XCELSIOR_POSTHOG_PROJECT_ID: ${XCELSIOR_POSTHOG_PROJECT_ID:-}
  XCELSIOR_NFS_SERVER: ${XCELSIOR_NFS_SERVER:-}
  XCELSIOR_NFS_SSH_HOST: ${XCELSIOR_NFS_SSH_HOST:-}
  XCELSIOR_NFS_SSH_USER: ${XCELSIOR_NFS_SSH_USER:-}
  XCELSIOR_NFS_PATH: ${XCELSIOR_NFS_PATH:-}
  XCELSIOR_NFS_MOUNT: ${XCELSIOR_NFS_MOUNT:-/mnt/xcelsior-nfs}
  XCELSIOR_NFS_EXPORT_BASE: ${XCELSIOR_NFS_EXPORT_BASE:-/exports/volumes}
  XCELSIOR_NFS_REQUIRED: ${XCELSIOR_NFS_REQUIRED:-false}
  XCELSIOR_NFS_MOUNT_OPTS: ${XCELSIOR_NFS_MOUNT_OPTS:-}
  XCELSIOR_NFS_SSH_CMD_WRAP: ${XCELSIOR_NFS_SSH_CMD_WRAP:-}
  XCELSIOR_SECRETS_KEY: ${XCELSIOR_SECRETS_KEY:-}
  # Chat LLM
  CHAT_LLM_PROVIDER: ${CHAT_LLM_PROVIDER:-groq}
  CHAT_LLM_API_KEY: ${CHAT_LLM_API_KEY:-}
  CHAT_LLM_MODEL: ${CHAT_LLM_MODEL:-}
  CHAT_MAX_RESPONSE_TOKENS: ${CHAT_MAX_RESPONSE_TOKENS:-1024}
  CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT:-10}
  CHAT_FALLBACK_PROVIDER: ${CHAT_FALLBACK_PROVIDER:-}
  CHAT_FALLBACK_API_KEY: ${CHAT_FALLBACK_API_KEY:-}
  CHAT_FALLBACK_MODEL: ${CHAT_FALLBACK_MODEL:-}
  # AI Assistant (Xcel AI)
  FEATURE_AI_ASSISTANT: ${FEATURE_AI_ASSISTANT:-false}
  AI_ASSISTANT_ENABLE_LIVE_CALLS: ${AI_ASSISTANT_ENABLE_LIVE_CALLS:-false}
  AI_ASSISTANT_PROVIDER: ${AI_ASSISTANT_PROVIDER:-xai}
  AI_ASSISTANT_FALLBACK_PROVIDERS: ${AI_ASSISTANT_FALLBACK_PROVIDERS:-anthropic,openai}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_ASSISTANT_MODEL: ${AI_ASSISTANT_MODEL:-claude-3-5-haiku-20241022}
  AI_ASSISTANT_XAI_API_KEY: ${AI_ASSISTANT_XAI_API_KEY:-}
  AI_ASSISTANT_XAI_MODEL: ${AI_ASSISTANT_XAI_MODEL:-grok-4}
  AI_ASSISTANT_OPENAI_API_KEY: ${AI_ASSISTANT_OPENAI_API_KEY:-}
  AI_ASSISTANT_OPENAI_MODEL: ${AI_ASSISTANT_OPENAI_MODEL:-gpt-4o-mini}
  AI_ASSISTANT_MAX_TOKENS: ${AI_ASSISTANT_MAX_TOKENS:-4096}
  AI_ASSISTANT_RATE_LIMIT: ${AI_ASSISTANT_RATE_LIMIT:-20}
  # SSH for web terminal proxy
  XCELSIOR_SSH_KEY_PATH: /run/secrets/ssh_key
  XCELSIOR_SSH_USER: ${XCELSIOR_SSH_USER:-xcelsior}
  # Observability
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://127.0.0.1:4317}
  XCELSIOR_OBSERVATION_STALE_SEC: ${XCELSIOR_OBSERVATION_STALE_SEC:-300}
  XCELSIOR_SERVICE_HEARTBEAT_FRESH_SEC: ${XCELSIOR_SERVICE_HEARTBEAT_FRESH_SEC:-60}
  XCELSIOR_OUTBOX_DISPATCHER: ${XCELSIOR_OUTBOX_DISPATCHER:-true}
  # Cloudburst
  XCELSIOR_BURST_ENABLED: ${XCELSIOR_BURST_ENABLED:-false}
  XCELSIOR_BURST_BUDGET_CAD: ${XCELSIOR_BURST_BUDGET_CAD:-500.0}
  XCELSIOR_BURST_MAX_INSTANCES: ${XCELSIOR_BURST_MAX_INSTANCES:-10}
  XCELSIOR_BURST_PROVIDER_PRIORITY: ${XCELSIOR_BURST_PROVIDER_PRIORITY:-hetzner,oci,gcp,aws}
  # Container Registry — forwarded to every service that interacts with
  # the registry (snapshot endpoint in api, health probe in bg-worker,
  # worker-upgrade push step). docker compose interpolates ${VAR} from
  # the .env file at compose time. Without _URL the bg-worker probe
  # silently skips and the snapshot endpoint returns 503.
  XCELSIOR_REGISTRY: ${XCELSIOR_REGISTRY:-}
  XCELSIOR_REGISTRY_URL: ${XCELSIOR_REGISTRY_URL:-}
  XCELSIOR_REGISTRY_USERNAME: ${XCELSIOR_REGISTRY_USERNAME:-}
  XCELSIOR_REGISTRY_PASSWORD: ${XCELSIOR_REGISTRY_PASSWORD:-}
  # Artifact storage. The local backend must use the mounted /data volume so
  # API-mediated uploads such as profile avatars survive container rebuilds.
  XCELSIOR_STORAGE_BACKEND: ${XCELSIOR_STORAGE_BACKEND:-local}
  XCELSIOR_STORAGE_LOCAL_DIR: ${XCELSIOR_STORAGE_LOCAL_DIR:-/data/artifacts}
  XCELSIOR_STORAGE_ENDPOINT_URL: ${XCELSIOR_STORAGE_ENDPOINT_URL:-}
  XCELSIOR_STORAGE_BUCKET: ${XCELSIOR_STORAGE_BUCKET:-}
  XCELSIOR_STORAGE_REGION: ${XCELSIOR_STORAGE_REGION:-}
  XCELSIOR_STORAGE_ACCESS_KEY_ID: ${XCELSIOR_STORAGE_ACCESS_KEY_ID:-}
  XCELSIOR_STORAGE_SECRET_ACCESS_KEY: ${XCELSIOR_STORAGE_SECRET_ACCESS_KEY:-}
  XCELSIOR_STORAGE_PRESIGN_EXPIRY: ${XCELSIOR_STORAGE_PRESIGN_EXPIRY:-3600}
  XCELSIOR_STORAGE_MAX_UPLOAD_MB: ${XCELSIOR_STORAGE_MAX_UPLOAD_MB:-500}
  # Serverless inference (feature flag + autoscaler/reaper tuning)
  XCELSIOR_SERVERLESS_ENABLED: ${XCELSIOR_SERVERLESS_ENABLED:-false}
  XCELSIOR_SERVERLESS_ALLOWLIST: ${XCELSIOR_SERVERLESS_ALLOWLIST:-}
  XCELSIOR_SERVERLESS_RECONCILE: ${XCELSIOR_SERVERLESS_RECONCILE:-true}
  XCELSIOR_SERVERLESS_SCALE_DOWN_COOLDOWN_SEC: ${XCELSIOR_SERVERLESS_SCALE_DOWN_COOLDOWN_SEC:-60}
  XCELSIOR_SERVERLESS_DRAIN_GRACE_SEC: ${XCELSIOR_SERVERLESS_DRAIN_GRACE_SEC:-30}
  XCELSIOR_SERVERLESS_JOB_HEARTBEAT_TTL_SEC: ${XCELSIOR_SERVERLESS_JOB_HEARTBEAT_TTL_SEC:-120}
  XCELSIOR_SERVERLESS_BOOTING_TTL_SEC: ${XCELSIOR_SERVERLESS_BOOTING_TTL_SEC:-900}
  XCELSIOR_SERVERLESS_QUEUE_TTL_SEC: ${XCELSIOR_SERVERLESS_QUEUE_TTL_SEC:-3600}
  XCELSIOR_SERVERLESS_MIN_BILLING_INTERVAL_SEC: ${XCELSIOR_SERVERLESS_MIN_BILLING_INTERVAL_SEC:-60}
  XCELSIOR_SERVERLESS_WEBHOOK_MAX_ATTEMPTS: ${XCELSIOR_SERVERLESS_WEBHOOK_MAX_ATTEMPTS:-3}
  XCELSIOR_SERVERLESS_WEBHOOK_TIMEOUT_SEC: ${XCELSIOR_SERVERLESS_WEBHOOK_TIMEOUT_SEC:-10}
  XCELSIOR_SERVERLESS_WEBHOOK_BACKOFF_BASE_SEC: ${XCELSIOR_SERVERLESS_WEBHOOK_BACKOFF_BASE_SEC:-5}
  XCELSIOR_SERVERLESS_WEBHOOK_MAX_BODY_BYTES: ${XCELSIOR_SERVERLESS_WEBHOOK_MAX_BODY_BYTES:-65536}
  XCELSIOR_SERVERLESS_WEBHOOK_HMAC_SECRET: ${XCELSIOR_SERVERLESS_WEBHOOK_HMAC_SECRET:-}
  XCELSIOR_SERVERLESS_PREDICTIVE_SCALING: ${XCELSIOR_SERVERLESS_PREDICTIVE_SCALING:-false}
  XCELSIOR_SERVERLESS_REDIS_RATE_LIMITS: ${XCELSIOR_SERVERLESS_REDIS_RATE_LIMITS:-false}
  XCELSIOR_SERVERLESS_REDIS_URL: ${XCELSIOR_SERVERLESS_REDIS_URL:-}
  XCELSIOR_SERVERLESS_CACHE_REPLICATE_REGIONS: ${XCELSIOR_SERVERLESS_CACHE_REPLICATE_REGIONS:-}
  # ── Worker identity and credential rotation (blueprint §19.2/§19.3) ──
  # Gateway identity: only honoured when the private gateway also presents
  # the shared secret; /readyz fails closed if the flag is on without it.
  XCELSIOR_TRUSTED_AGENT_GATEWAY: ${XCELSIOR_TRUSTED_AGENT_GATEWAY:-}
  XCELSIOR_AGENT_GATEWAY_SECRET: ${XCELSIOR_AGENT_GATEWAY_SECRET:-}
  XCELSIOR_SPIFFE_TRUST_DOMAIN: ${XCELSIOR_SPIFFE_TRUST_DOMAIN:-xcelsior.ca}
  # Strict SPIFFE→host binding. Default on (live-mesh posture); set 0 only
  # while the interim Nginx mTLS gateway (cert DN, no SVID) is in front.
  XCELSIOR_SPIFFE_STRICT: ${XCELSIOR_SPIFFE_STRICT:-1}
  XCELSIOR_AGENT_STRICT_HOST_BINDING: ${XCELSIOR_AGENT_STRICT_HOST_BINDING:-}
  # Shared fleet bearer — the credential rotation is retiring.
  XCELSIOR_AGENT_SHARED_BEARER_MIGRATION: ${XCELSIOR_AGENT_SHARED_BEARER_MIGRATION:-}
  XCELSIOR_AGENT_SHARED_BEARER_HOSTS: ${XCELSIOR_AGENT_SHARED_BEARER_HOSTS:-}
  # Per-host agent tokens: off | allow (default) | require.
  # "require" completes field-wide rotation — check
  # GET /api/admin/agent-tokens/coverage first, a host without a token
  # is locked out by that flip.
  XCELSIOR_AGENT_HOST_TOKENS: ${XCELSIOR_AGENT_HOST_TOKENS:-allow}
  XCELSIOR_AGENT_TOKEN_TTL_DAYS: ${XCELSIOR_AGENT_TOKEN_TTL_DAYS:-90}
  XCELSIOR_AGENT_TOKEN_ROTATION_GRACE_MINUTES: ${XCELSIOR_AGENT_TOKEN_ROTATION_GRACE_MINUTES:-60}
  # Public worker surface: allow (default) | deny. "deny" is the §22.1
  # cutover — pair it with nginx/snippets/xcelsior-agent-retired.conf.
  XCELSIOR_AGENT_PUBLIC_INGRESS: ${XCELSIOR_AGENT_PUBLIC_INGRESS:-allow}
  # Two secrets `control_plane/startup_validation.py` refuses production
  # without. There is no `env_file:` on any service here — every variable
  # reaches a container only by being named in this anchor — so having them in
  # `.env` was not enough: they were set on the host and unset in the process
  # that reads them, and the 2026-08-04 deploy failed its boot on exactly that.
  #
  # Compatibility sessions derive host submit tokens from this; unset means a
  # public development constant and forgeable provider evidence.
  XCELSIOR_COMPAT_SESSION_SECRET: ${XCELSIOR_COMPAT_SESSION_SECRET:-}
  # Audit checkpoint signing (`control_plane/audit_checkpoints.py`, reached from
  # `bg_worker.py` through this same anchor). Unset means checkpoints are signed
  # with the public development key and the audit trail is forgeable.
  XCELSIOR_AUDIT_SIGNING_KEYS: ${XCELSIOR_AUDIT_SIGNING_KEYS:-}
  XCELSIOR_AUDIT_SIGNING_ACTIVE: ${XCELSIOR_AUDIT_SIGNING_ACTIVE:-}
  # The single-key form the same check accepts as an alternative to the map.
  XCELSIOR_AUDIT_SIGNING_KEY: ${XCELSIOR_AUDIT_SIGNING_KEY:-}
  # Default `host_ssh` already passes validation, so this is not a live gap —
  # but an operator setting it in `.env` would have been ignored exactly as the
  # two secrets above were. Mapped so the setting is real, and so
  # `tests/test_startup_env_is_wired.py` needs no exemption list.
  XCELSIOR_VOLUME_PRIVILEGE: ${XCELSIOR_VOLUME_PRIVILEGE:-host_ssh}
  # ── Set in .env, reaching no container until now ──────────────────────
  # Every one of these was configured with a real value and read by code that
  # never saw it. `/api/connect/webhooks` answered 503 to every Stripe delivery
  # because its signing secret was not here — the handler fails closed on a
  # missing secret, so the endpoint has been dead rather than open.
  XCELSIOR_STRIPE_THIN_WEBHOOK_SECRET: ${XCELSIOR_STRIPE_THIN_WEBHOOK_SECRET:-}
  XCELSIOR_STRIPE_CONNECT_WEBHOOK_SECRET: ${XCELSIOR_STRIPE_CONNECT_WEBHOOK_SECRET:-}
  # XCELSIOR_STRIPE_SANDBOX_WEBHOOK_SECRET is already mapped above. It was
  # added a second time here as a "declared fallback" without checking, and a
  # duplicate YAML key makes the whole file unparseable to docker — the deploy
  # failed at the build step with the file unreadable. Left as a comment so the
  # next person reaching for it finds this instead of re-adding it.
  # Replies to platform mail went nowhere: ALERT_CONFIG["reply_to"] read ''.
  XCELSIOR_EMAIL_REPLY_TO: ${XCELSIOR_EMAIL_REPLY_TO:-}
  # volumes.py enforced the 2000 GB default, not the configured 100 GB cap.
  XCELSIOR_MAX_TOTAL_STORAGE_GB: ${XCELSIOR_MAX_TOTAL_STORAGE_GB:-2000}
  # artifacts.py had no R2 endpoint, so artifact caching was off.
  XCELSIOR_CACHE_ENDPOINT_URL: ${XCELSIOR_CACHE_ENDPOINT_URL:-}
  # bitcoin.py: deposits addressed the default wallet, and a status probe that
  # was meant to give up after 1.5s could hang for 20.
  XCELSIOR_BTC_RPC_WALLET: ${XCELSIOR_BTC_RPC_WALLET:-}
  XCELSIOR_BTC_STATUS_RPC_TIMEOUT: ${XCELSIOR_BTC_STATUS_RPC_TIMEOUT:-20}
  # The API runs legacy queue walkers during rollout, so it reads these too.
  XCELSIOR_AUTOSCALE: ${XCELSIOR_AUTOSCALE:-}
  XCELSIOR_AUTOSCALE_PROVIDER: ${XCELSIOR_AUTOSCALE_PROVIDER:-}

# ── Shared API volumes ───────────────────────────────────────────────
# Phase 10: API/bg-worker do NOT mount host /exports (no privileged volume
# surface). LUKS/NFS device work is host-SSH (volumes.py) or the optional
# volume-provisioner profile.
x-api-volumes: &api-volumes
  - xcelsior-data:/data
  - ${HOME}/.ssh/xcelsior:/run/secrets/ssh_key:ro

# ── Unprivileged runtime posture (blueprint §19.4 / §21.1) ───────────
# The image already runs as uid 10001; this block adds the container-level
# half: no capabilities at all, no privilege escalation, and a read-only
# root filesystem with explicit writable tmpfs where the process genuinely
# needs one (gunicorn's worker heartbeat lives in /dev/shm).
#
# XCELSIOR_API_USER exists because the SSH key bind-mounted from the
# operator's home directory must be readable by the runtime user. Set it
# to the owning uid:gid on a host where re-owning that key is not
# acceptable; leave it at the image default everywhere else.
x-api-hardening: &api-hardening
  user: "${XCELSIOR_API_USER:-10001:10001}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=256m
    - /dev/shm:rw,nosuid,nodev,size=64m
    - /home/xcelsior/.ssh:rw,nosuid,nodev,mode=0700,uid=10001,gid=10001,size=1m

services:
  api:
    build: .
    <<: *api-hardening
    command: gunicorn api:app -c gunicorn.conf.py
    # Phase 10: API is unprivileged — LUKS/NFS privileged ops run via SSH
    # to the host or the volume-provisioner service (no SYS_ADMIN here).
    environment:
      <<: *api-env
      XCELSIOR_SERVICE: api
      XCELSIOR_POSTGRES_DSN_API: ${XCELSIOR_POSTGRES_DSN_API:-}
      XCELSIOR_API_PORT: ${XCELSIOR_API_PORT:-9500}
      XCELSIOR_BG_TASKS: "false"
    network_mode: host
    volumes: *api-volumes
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${XCELSIOR_API_PORT:-9500}/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  api-blue:
    build: .
    <<: *api-hardening
    command: gunicorn api:app -c gunicorn.conf.py
    environment:
      <<: *api-env
      XCELSIOR_SERVICE: api
      XCELSIOR_POSTGRES_DSN_API: ${XCELSIOR_POSTGRES_DSN_API:-}
      XCELSIOR_API_PORT: ${XCELSIOR_API_BLUE_PORT:-9501}
      XCELSIOR_BG_TASKS: "false"
    network_mode: host
    profiles: ["blue"]
    volumes: *api-volumes
    restart: unless-stopped
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:${XCELSIOR_API_BLUE_PORT:-9501}/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3

  scheduler-worker:
    build: .
    # network_mode: host — scheduler must reach Headscale IPs for ping + SSH
    network_mode: host
    command: python -c "from scheduler import scheduler_main; scheduler_main()"
    environment:
      XCELSIOR_ENV: ${XCELSIOR_ENV:-production}
      # Companion §4.2/§4.3: own connection identity, and (once an
      # operator sets the DSN) its own least-privilege role.
      XCELSIOR_SERVICE: scheduler
      XCELSIOR_AUTOSCALE: ${XCELSIOR_AUTOSCALE:-}
      XCELSIOR_AUTOSCALE_PROVIDER: ${XCELSIOR_AUTOSCALE_PROVIDER:-}
      XCELSIOR_EMAIL_REPLY_TO: ${XCELSIOR_EMAIL_REPLY_TO:-}
      XCELSIOR_POSTGRES_DSN_SCHEDULER: ${XCELSIOR_POSTGRES_DSN_SCHEDULER:-}
      XCELSIOR_API_TOKEN: ${XCELSIOR_API_TOKEN}
      XCELSIOR_DB_BACKEND: ${XCELSIOR_DB_BACKEND:-postgres}
      XCELSIOR_DB_PATH: /data/xcelsior.db
      XCELSIOR_AUTH_DB_PATH: /data/auth.db
      XCELSIOR_BILLING_DB_PATH: /data/xcelsior_billing.db
      XCELSIOR_REPUTATION_DB_PATH: /data/xcelsior_reputation.db
      XCELSIOR_SLA_DB: /data/xcelsior_sla.db
      XCELSIOR_SLURM_MAP: /data/slurm_jobs.json
      XCELSIOR_HOSTS_FILE: /data/hosts.json
      XCELSIOR_JOBS_FILE: /data/jobs.json
      XCELSIOR_BILLING_FILE: /data/billing.json
      XCELSIOR_MARKETPLACE_FILE: /data/marketplace.json
      XCELSIOR_AUTOSCALE_FILE: /data/autoscale_pool.json
      XCELSIOR_SPOT_PRICES_FILE: /data/spot_prices.json
      XCELSIOR_COMPUTE_SCORES_FILE: /data/compute_scores.json
      XCELSIOR_LOG_FILE: /data/xcelsior.log
      XCELSIOR_POSTGRES_DSN: postgresql://xcelsior:${XCELSIOR_POSTGRES_PASSWORD:-xcelsior}@127.0.0.1:5432/${XCELSIOR_POSTGRES_DB:-xcelsior}
      # Track A: paused | shadow | canary | active (shadow = read-only
      # comparison of the new placement pipeline against this legacy loop)
      XCELSIOR_SCHEDULER_MODE: ${XCELSIOR_SCHEDULER_MODE:-paused}
      XCELSIOR_SCHEDULER_SHADOW_INTERVAL_SEC: ${XCELSIOR_SCHEDULER_SHADOW_INTERVAL_SEC:-15}
      XCELSIOR_SCHEDULER_SHADOW_COMPARE_GRACE_SEC: ${XCELSIOR_SCHEDULER_SHADOW_COMPARE_GRACE_SEC:-30}
      XCELSIOR_SCHEDULER_SHADOW_RETENTION_DAYS: ${XCELSIOR_SCHEDULER_SHADOW_RETENTION_DAYS:-14}
      XCELSIOR_SCHEDULER_CANARY_GPU_MODELS: ${XCELSIOR_SCHEDULER_CANARY_GPU_MODELS:-}
      XCELSIOR_SCHEDULER_CANARY_HOSTS: ${XCELSIOR_SCHEDULER_CANARY_HOSTS:-}
      XCELSIOR_SCHEDULER_CLAIMS_ENABLED: ${XCELSIOR_SCHEDULER_CLAIMS_ENABLED:-true}
      # Phase 7: deliver outbox side-effect intents (SSE via pg_notify)
      XCELSIOR_OUTBOX_DISPATCHER: ${XCELSIOR_OUTBOX_DISPATCHER:-true}
      # Phase 6 (P6.3): per-finding-type reconciler remediation. Default
      # report-only per action; "enforce" turns each on. stale-fence →
      # durable stop_container (§11.5 backstop); attempt-container-missing →
      # expedite lease expiry (zombie attempt); orphaned-allocation →
      # release a device leaked by a partial settlement (§8.2 capacity).
      XCELSIOR_RECONCILE_ACTION_STALE_FENCE_CONTAINER: ${XCELSIOR_RECONCILE_ACTION_STALE_FENCE_CONTAINER:-report_only}
      XCELSIOR_RECONCILE_ACTION_ATTEMPT_CONTAINER_MISSING: ${XCELSIOR_RECONCILE_ACTION_ATTEMPT_CONTAINER_MISSING:-report_only}
      XCELSIOR_RECONCILE_ACTION_ORPHANED_ALLOCATION: ${XCELSIOR_RECONCILE_ACTION_ORPHANED_ALLOCATION:-report_only}
      XCELSIOR_PLATFORM_CUT: ${XCELSIOR_PLATFORM_CUT:-0.20}
      XCELSIOR_SMTP_HOST: ${XCELSIOR_SMTP_HOST:-}
      XCELSIOR_SMTP_PORT: ${XCELSIOR_SMTP_PORT:-587}
      XCELSIOR_SMTP_USER: ${XCELSIOR_SMTP_USER:-}
      XCELSIOR_SMTP_PASS: ${XCELSIOR_SMTP_PASS:-}
      XCELSIOR_EMAIL_FROM: ${XCELSIOR_EMAIL_FROM:-}
      XCELSIOR_EMAIL_TO: ${XCELSIOR_EMAIL_TO:-}
      XCELSIOR_TG_TOKEN: ${XCELSIOR_TG_TOKEN:-}
      XCELSIOR_TG_CHAT_ID: ${XCELSIOR_TG_CHAT_ID:-}
      XCELSIOR_WEB_PUSH_VAPID_PUBLIC_KEY: ${XCELSIOR_WEB_PUSH_VAPID_PUBLIC_KEY:-}
      XCELSIOR_WEB_PUSH_VAPID_PRIVATE_KEY: ${XCELSIOR_WEB_PUSH_VAPID_PRIVATE_KEY:-}
      XCELSIOR_WEB_PUSH_VAPID_SUBJECT: ${XCELSIOR_WEB_PUSH_VAPID_SUBJECT:-mailto:hello@xcelsior.ca}
      XCELSIOR_WEB_PUSH_STALE_AFTER_DAYS: ${XCELSIOR_WEB_PUSH_STALE_AFTER_DAYS:-30}
      XCELSIOR_WEB_PUSH_REVOKED_RETENTION_DAYS: ${XCELSIOR_WEB_PUSH_REVOKED_RETENTION_DAYS:-30}
      XCELSIOR_NOTIFICATION_RETENTION_DAYS: ${XCELSIOR_NOTIFICATION_RETENTION_DAYS:-30}
      XCELSIOR_SSH_KEY_PATH: /run/secrets/ssh_key
      XCELSIOR_SSH_USER: ${XCELSIOR_SSH_USER:-xcelsior}
      XCELSIOR_REGISTRY: ${XCELSIOR_REGISTRY:-}
      # Phase E — these three are forwarded to every service that
      # might interact with the container registry (snapshot endpoint,
      # bg-worker health probe, worker upgrade push step). Kept in
      # sync with the local .env; docker-compose dereferences ${VAR}
      # at compose time so setting the value there is sufficient.
      XCELSIOR_REGISTRY_URL: ${XCELSIOR_REGISTRY_URL:-}
      XCELSIOR_REGISTRY_USERNAME: ${XCELSIOR_REGISTRY_USERNAME:-}
      XCELSIOR_REGISTRY_PASSWORD: ${XCELSIOR_REGISTRY_PASSWORD:-}
      XCELSIOR_NFS_SERVER: ${XCELSIOR_NFS_SERVER:-}
      XCELSIOR_NFS_SSH_HOST: ${XCELSIOR_NFS_SSH_HOST:-}
      XCELSIOR_NFS_SSH_USER: ${XCELSIOR_NFS_SSH_USER:-}
      XCELSIOR_NFS_PATH: ${XCELSIOR_NFS_PATH:-}
      XCELSIOR_NFS_MOUNT: ${XCELSIOR_NFS_MOUNT:-/mnt/xcelsior-volumes}
      XCELSIOR_NFS_EXPORT_BASE: ${XCELSIOR_NFS_EXPORT_BASE:-/exports/volumes}
      XCELSIOR_NFS_MOUNT_OPTS: ${XCELSIOR_NFS_MOUNT_OPTS:-}
      XCELSIOR_NFS_SSH_CMD_WRAP: ${XCELSIOR_NFS_SSH_CMD_WRAP:-}
    # Runs as the image's unprivileged user; known_hosts moves out of
    # /root into that user's home so SSH host verification still works.
    user: "${XCELSIOR_API_USER:-10001:10001}"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - xcelsior-data:/data
      - ${HOME}/.ssh/xcelsior:/run/secrets/ssh_key:ro
      - ${HOME}/.ssh/known_hosts:/home/xcelsior/.ssh/known_hosts:ro
      # No /exports — scheduler uses host-SSH for privileged volume ops.
    restart: unless-stopped
    # This image's Dockerfile HEALTHCHECK probes the API's HTTP /healthz,
    # which a headless worker doesn't serve — that gave a permanent false
    # "unhealthy". Override with a process-liveness check instead.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa scheduler_main /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Background Task Worker ─────────────────────────────────────────
  # Runs billing, webhooks, spot pricing, inference, cloudburst, SLA,
  # events, privacy, session cleanup, FINTRAC, log cleanup, notifications,
  # and Lightning deposit watcher — all outside the API server process.
  bg-worker:
    build: .
    <<: *api-hardening
    command: python bg_worker.py
    network_mode: host
    environment:
      <<: *api-env
      XCELSIOR_SERVICE: billing
      XCELSIOR_POSTGRES_DSN_BILLING: ${XCELSIOR_POSTGRES_DSN_BILLING:-}
    volumes: *api-volumes
    restart: unless-stopped
    depends_on:
      - api
    # Override the image's API-oriented HTTP HEALTHCHECK (this worker has no
    # HTTP port) with a process-liveness check.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa bg_worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  mcp:
    build: ./mcp
    network_mode: host
    environment:
      XCELSIOR_API_URL: ${XCELSIOR_API_URL:-http://127.0.0.1:9500}
      XCELSIOR_MCP_API_URL: ${XCELSIOR_MCP_API_URL:-http://127.0.0.1:9500}
      XCELSIOR_MCP_PUBLIC_URL: ${XCELSIOR_MCP_PUBLIC_URL:-https://mcp.xcelsior.ca/mcp}
      # RFC 8707 resource identifier: the exact URL a user pastes into a
      # connector, path included. The bare origin is the pre-migration value
      # and is accepted only until the sunset below.
      XCELSIOR_MCP_RESOURCE_AUDIENCE: ${XCELSIOR_MCP_RESOURCE_AUDIENCE:-https://mcp.xcelsior.ca/mcp}
      XCELSIOR_MCP_LEGACY_RESOURCE_AUDIENCE: ${XCELSIOR_MCP_LEGACY_RESOURCE_AUDIENCE:-https://mcp.xcelsior.ca}
      XCELSIOR_MCP_LEGACY_AUDIENCE_SUNSET: ${XCELSIOR_MCP_LEGACY_AUDIENCE_SUNSET:-2026-11-30T00:00:00Z}
      # `customer` is the public, directory-listed surface. The operator
      # surface is the same image deployed with `operator` at an unlisted host.
      XCELSIOR_MCP_TOOL_PROFILE: ${XCELSIOR_MCP_TOOL_PROFILE:-customer}
      # ChatGPT company-knowledge search/fetch. Optional and off by default so
      # the directory-reviewed surface does not change without a decision.
      XCELSIOR_MCP_COMPANY_KNOWLEDGE: ${XCELSIOR_MCP_COMPANY_KNOWLEDGE:-0}
      XCELSIOR_DOCS_URL: ${XCELSIOR_DOCS_URL:-https://docs.xcelsior.ca}
      # Set once the OpenAI submission portal issues a verification token.
      XCELSIOR_MCP_OPENAI_APPS_CHALLENGE: ${XCELSIOR_MCP_OPENAI_APPS_CHALLENGE:-}
      XCELSIOR_OAUTH_ISSUER: ${XCELSIOR_OAUTH_ISSUER:-https://xcelsior.ca}
      XCELSIOR_OAUTH_JWKS_URL: ${XCELSIOR_OAUTH_JWKS_URL:-https://xcelsior.ca/.well-known/jwks.json}
      XCELSIOR_MCP_MAX_WATCHES_PER_PRINCIPAL: ${XCELSIOR_MCP_MAX_WATCHES_PER_PRINCIPAL:-3}
      XCELSIOR_MCP_LAUNCH_ATTEMPTS_PER_HOUR: ${XCELSIOR_MCP_LAUNCH_ATTEMPTS_PER_HOUR:-20}
      XCELSIOR_MCP_SERVERLESS_INVOCATIONS_PER_MIN: ${XCELSIOR_MCP_SERVERLESS_INVOCATIONS_PER_MIN:-120}
      MCP_HOST: 0.0.0.0
      MCP_PORT: ${MCP_PORT:-8770}
      MCP_PATH: /mcp
      MCP_RATE_LIMIT_PER_MIN: ${MCP_RATE_LIMIT_PER_MIN:-120}
      # Phase 10 / §31: multi-replica rate limit — Redis required, fail-closed
      # when backend is down (never process-local unlimited under replicas).
      MCP_RATE_LIMIT_BACKEND: ${MCP_RATE_LIMIT_BACKEND:-redis}
      MCP_REDIS_URL: ${XCELSIOR_MCP_REDIS_URL:-${MCP_REDIS_URL:-${XCELSIOR_AUTH_REDIS_URL:-redis://127.0.0.1:6379/0}}}
      MCP_RATE_LIMIT_REQUIRE_REDIS: ${MCP_RATE_LIMIT_REQUIRE_REDIS:-true}
      MCP_RATE_LIMIT_FAIL_CLOSED: ${MCP_RATE_LIMIT_FAIL_CLOSED:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_HTTP_ENDPOINT:-http://127.0.0.1:4318}
      OTEL_SERVICE_NAME: xcelsior-mcp
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8770/readyz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  mcp-blue:
    extends:
      service: mcp
    profiles: ["blue"]
    environment:
      MCP_PORT: 8771
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8771/readyz"]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://xcelsior.ca}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://xcelsior.ca}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://xcelsior.ca}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_LIVE_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_STRIPE_SANDBOX_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_SANDBOX_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_PAYPAL_MODE: ${NEXT_PUBLIC_PAYPAL_MODE:-sandbox}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_GA_MEASUREMENT_ID: ${NEXT_PUBLIC_GA_MEASUREMENT_ID:-}
        NEXT_PUBLIC_REOWN_PROJECT_ID: ${NEXT_PUBLIC_REOWN_PROJECT_ID:-}
    network_mode: host
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://xcelsior.ca}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://localhost:9555}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
    depends_on:
      - api
    restart: unless-stopped

  ssh-gateway:
    build: .
    command: python ssh_gateway.py
    network_mode: host
    environment:
      XCELSIOR_POSTGRES_DSN: postgresql://xcelsior:${XCELSIOR_POSTGRES_PASSWORD:-xcelsior}@127.0.0.1:5432/${XCELSIOR_POSTGRES_DB:-xcelsior}
      SSH_GW_HEALTH_PORT: "9510"
      SSH_GW_MAX_CONNS: "10"
      SSH_GW_IDLE_TIMEOUT: "3600"
      SSH_GW_SYNC_INTERVAL: "30"
      SSH_GW_SHUTDOWN_DRAIN_SEC: "300"
    depends_on:
      - api
    restart: unless-stopped
    stop_grace_period: 3600s
    # Real liveness: the gateway serves an HTTP health endpoint on
    # SSH_GW_HEALTH_PORT (returns 200 whenever the asyncio loop is alive),
    # so probe that instead of the image's API /healthz default.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9510/ >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  ssh-gateway-blue:
    build: .
    command: python ssh_gateway.py
    network_mode: host
    profiles: ["blue"]
    environment:
      XCELSIOR_POSTGRES_DSN: postgresql://xcelsior:${XCELSIOR_POSTGRES_PASSWORD:-xcelsior}@127.0.0.1:5432/${XCELSIOR_POSTGRES_DB:-xcelsior}
      SSH_GW_HEALTH_PORT: "9511"
      SSH_GW_MAX_CONNS: "10"
      SSH_GW_IDLE_TIMEOUT: "3600"
      SSH_GW_SYNC_INTERVAL: "30"
      SSH_GW_SHUTDOWN_DRAIN_SEC: "300"
    depends_on:
      - api
    restart: unless-stopped
    stop_grace_period: 3600s
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9511/ >/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Volume provisioner (Phase 10 privilege split) ──────────────────
  # Optional: only hosts that still need local loop/cryptsetup on /exports.
  # Default production path is host-SSH from API without this profile.
  volume-provisioner:
    build:
      context: ./infra/volume-provisioner
    profiles: ["volume-provisioner"]
    network_mode: host
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - /exports:/exports
      - xcelsior-data:/data
    environment:
      XCELSIOR_NFS_EXPORT_BASE: ${XCELSIOR_NFS_EXPORT_BASE:-/exports/volumes}
      XCELSIOR_VOLUME_PRIVILEGE: local
    restart: unless-stopped

  # ── Private observability plane ────────────────────────────────────
  # Only operator UIs and OTLP ingress bind to the host, always on loopback.
  # Exporter and storage ports remain reachable only on this bridge network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    user: "0:0"
    command:
      - --config=/etc/otelcol-contrib/config.yaml
    environment:
      XCELSIOR_ENV: ${XCELSIOR_ENV:-production}
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    volumes:
      - ./infra/observability/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - otel-collector-data:/var/lib/otelcol
    networks:
      - observability
    depends_on:
      - loki
      - tempo
      - jaeger
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - /otelcol-contrib
        - validate
        - --config=/etc/otelcol-contrib/config.yaml
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
      - --storage.tsdb.wal-compression
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    ports:
      - "127.0.0.1:9091:9090"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/prometheus/recording-rules.yml:/etc/prometheus/rules/recording-rules.yml:ro
      - ./infra/observability/prometheus/alert-rules.yml:/etc/prometheus/rules/alert-rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability
    depends_on:
      - alertmanager
      - node-exporter
      - postgres-exporter
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9090/-/ready
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=120h
      - --web.listen-address=0.0.0.0:9093
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - ${XCELSIOR_ALERTMANAGER_CONFIG_PATH:-./infra/observability/alertmanager/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:9093/-/ready
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: ${XCELSIOR_GRAFANA_ADMIN_USER:-xcelsior-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${XCELSIOR_GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_SECRET_KEY: ${XCELSIOR_GRAFANA_SECRET_KEY:-}
      GF_PATHS_CONFIG: /etc/grafana/grafana.ini
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./infra/observability/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/log/grafana:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3000/api/health
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  loki:
    image: grafana/loki:3.5.3
    command:
      - -config.file=/etc/loki/loki.yaml
    volumes:
      - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:3100/ready
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  tempo:
    image: grafana/tempo:2.8.2
    command:
      - -config.file=/etc/tempo/tempo.yaml
    volumes:
      - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - /tempo
        - -config.file=/etc/tempo/tempo.yaml
        - -config.verify=true
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_URI: ${XCELSIOR_POSTGRES_EXPORTER_URI:-host.docker.internal:5432/${XCELSIOR_POSTGRES_DB:-xcelsior}?sslmode=disable}
      DATA_SOURCE_USER: ${XCELSIOR_POSTGRES_EXPORTER_USER:-xcelsior}
      DATA_SOURCE_PASS: ${XCELSIOR_POSTGRES_EXPORTER_PASSWORD:-${XCELSIOR_POSTGRES_PASSWORD:-}}
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - /bin/postgres_exporter
        - --version
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  node-exporter:
    image: prom/node-exporter:v1.9.1
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test:
        - CMD
        - /bin/node_exporter
        - --version
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # Jaeger remains a local trace UI during the Tempo transition. OTLP reaches
  # it through the collector; its receiver ports are not exposed on the host.
  jaeger:
    image: jaegertracing/jaeger:2.6.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - jaeger-data:/badger
    networks:
      - observability
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test:
        - CMD
        - /cmd/jaeger/jaeger-linux
        - version
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  xcelsior-data:
  otel-collector-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  loki-data:
  tempo-data:
  jaeger-data:

networks:
  observability:
    driver: bridge

name: Desktop CI

on:
  pull_request:
    paths:
      - "api/desktop/**"
      - "api/frontend/package.json"
      - "api/frontend/package-lock.json"
      - "api/frontend/src/lib/desktop/**"
      - "api/frontend/src/__tests__/desktop-*.test.*"
      - "api/frontend/src/components/DesktopAppRuntime.tsx"
      - "api/frontend/src/components/DesktopStatusStrip.tsx"
      - "api/frontend/src/components/settings/NativeDesktopPreferences.tsx"
      - "api/frontend/src/app/(dashboard)/dashboard-shell.tsx"
  push:
    branches: [main]
    paths:
      - "api/desktop/**"
      - "api/frontend/package.json"
      - "api/frontend/package-lock.json"
      - "api/frontend/src/lib/desktop/**"
      - "api/frontend/src/__tests__/desktop-*.test.*"
      - "api/frontend/src/components/DesktopAppRuntime.tsx"
      - "api/frontend/src/components/DesktopStatusStrip.tsx"
      - "api/frontend/src/components/settings/NativeDesktopPreferences.tsx"
      - "api/frontend/src/app/(dashboard)/dashboard-shell.tsx"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: api/desktop

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: api/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: api/desktop/src-tauri

      - name: Install desktop dependencies
        run: npm ci

      - name: Type check control center
        run: npm run typecheck

      - name: Test control center
        run: npm test

      - name: Test native shell
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build native desktop shell
        run: npx tauri build --debug --no-bundle

name: Sync to Org Mirror

on:
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so push succeeds seamlessly

      - name: Push to Org Mirror
        env:
          SYNC_ORG_PAT: ${{ secrets.SYNC_ORG_PAT }}
        run: |
          if [ -z "$SYNC_ORG_PAT" ]; then
            echo "Error: SYNC_ORG_PAT secret is not set."
            exit 1
          fi
          
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add the organization repository as a remote
          # Change 'xcelsior-gpu' or 'xcelsior' if your destination org/repo has a different name
          git remote add mirror "https://x-access-token:${SYNC_ORG_PAT}@github.com/xcelsior-gpu/xcelsior.git"
          
          # Push the main branch to the organization mirror
          git push mirror main --force

name: Publish MCP CLI

on:
  push:
    tags: ["mcp-v*"]

permissions:
  contents: read

jobs:
  publish:
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. Skipped rather than deleted — set the repo variable
    # HOSTED_ACTIONS=enabled to bring it back.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/mcp-cli
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - run: npm run build
        working-directory: api/mcp
      - run: rm -rf dist && cp -r ../mcp/dist ./dist
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

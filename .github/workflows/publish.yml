name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # ── PyPI Package ────────────────────────────────────────────────────
  pypi:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    environment: release
    permissions:
      contents: read
      id-token: write  # OIDC for trusted PyPI publishing; this job only
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install build twine

      - name: Build distribution
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          # Uses trusted publishing (OIDC) — no API token needed
          # Configure at: https://pypi.org/manage/project/xcelsior/settings/publishing/
          skip-existing: true

  # ── Docker Image ────────────────────────────────────────────────────
  docker:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    needs: pypi
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: meta
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # One step, not two. A stray `-` split the name from the action, leaving
      # a step with neither `uses` nor `run` — which GitHub rejects at startup,
      # so the whole workflow failed to start rather than this one step failing.
      # The frontend step below has the shape this should have had all along.
      - name: Build and push API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api/frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-frontend:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── npm SDK ─────────────────────────────────────────────────────────
  sdk:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    needs: pypi
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Fern
        run: npm install -g fern-api

      - name: Generate & publish SDK
        run: fern generate --group publish
        working-directory: ./api/fern
        env:
          FERN_TOKEN: ${{ secrets.FERN_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

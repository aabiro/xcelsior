name: MCP Server

on:
  push:
    paths:
      - "mcp/**"
      - "control_plane/**"
      - "routes/**"
      - "oauth_service.py"
      - "scheduler.py"
      - "db.py"
      - "migrations/**"
      - "scripts/mcp_e2e_fixture.py"
      - ".github/workflows/mcp.yml"

# ── Why there is no `pull_request` trigger ────────────────────────────────────
# There was one, and it stopped every gate in this repository for weeks.
#
# The `test` job below moved from `ubuntu-latest` to the sandboxed self-hosted
# runner when hosted Actions stayed blocked, and the `pull_request` trigger came
# along with it. This repository is **public**, so that combination lets an
# outside contributor's fork run code on that machine — the exact threat model
# `gates-sandboxed.yml` documents at length and the reason it has no such
# trigger.
#
# `scripts/ci-runner/run-runner.sh` refuses to start while any workflow on the
# runner can be triggered from a fork, and it did its job: the runner exited on
# startup 1,865 times. But a runner that refuses to start is indistinguishable
# from one that is merely offline, and a job waiting for it reads as "queued",
# not "never going to run" — the sandboxed gates run for the last merge to main
# sat queued for 21 hours. So those gates went dark and nothing said so.
#
# Scope, precisely: this took down ruff and the pure-parse gates, which is all
# `gates-sandboxed.yml` runs. pyright, the DB-backed suite, the compose check
# and the frontend/MCP suites live in `ci.yml` and are dark for an unrelated
# reason — hosted Actions is blocked at the account level, and every job there
# is deliberately skipped behind `vars.HOSTED_ACTIONS`. Restoring this runner
# does not bring those back.
#
# `push` needs write access to this repository and a fork cannot push a branch
# here, so it covers every PR raised from a branch on this repo. A fork PR gets
# no MCP check, which is the deliberate trade: the alternative is arbitrary code
# execution on the runner.

jobs:
  test:
    # This job has nowhere to run at present, and says so rather than failing.
    #
    # It was moved off `ubuntu-latest` because hosted Actions is blocked at the
    # account level — the reasoning was sound and the envelope is right: no
    # secret, no docker. But the sandboxed runner cannot complete `npm ci`. The
    # first run after the workflow was repaired failed in 20s with corrupted
    # tarballs, `TAR_ENTRY_ERROR ENOENT` and `ENOTEMPTY` — a filesystem the
    # extract cannot use, not a dependency problem. `gates-sandboxed.yml`
    # succeeds on the same runner because `uv sync --frozen` does not need it.
    #
    # So the choice is a red check on every push or an honest skip, and this
    # file already answers that two jobs below: "a job that fails on every push
    # is worse than no job: it trains everyone to ignore the CI column, which is
    # where a real failure would have to be noticed."
    #
    # Until hosted Actions returns, `cd mcp && npm ci && npm test` locally is
    # what covers this — 298 tests, plus typecheck, check:api, audit and build.
    # Dropping `runs-on` back to ubuntu-latest keeps it one variable away from
    # running again, like every other gated job here.
    runs-on: ubuntu-latest
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:api
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: npm run build
      - run: test -f dist/stdio.js

  docker:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    #
    # One `if:`, not two. The HOSTED_ACTIONS guard was inserted above a job
    # that already had a condition, and YAML does not merge duplicate keys —
    # GitHub rejects the whole workflow at startup, so every job in this file
    # stopped running rather than skipping cleanly. That is precisely the
    # outcome the comment above says it is avoiding.
    if: >-
      ${{ vars.HOSTED_ACTIONS == 'enabled'
          && github.event_name == 'push'
          && github.ref == 'refs/heads/main' }}
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t xcelsior-mcp:ci ./mcp

  real-stack:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: xcelsior_test
          POSTGRES_USER: xcelsior
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U xcelsior"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      XCELSIOR_ENV: test
      XCELSIOR_DB_BACKEND: postgres
      XCELSIOR_POSTGRES_DSN: postgresql://xcelsior:test@127.0.0.1:5432/xcelsior_test
      XCELSIOR_PG_DSN: postgresql://xcelsior:test@127.0.0.1:5432/xcelsior_test
      XCELSIOR_API_TOKEN: test-token-not-for-production
      XCELSIOR_AUTH_CACHE_BACKEND: memory
      XCELSIOR_BG_TASKS: "false"
      XCELSIOR_ALLOW_UNAUTH_AGENT: "0"
      XCELSIOR_MCP_REAL_STACK_E2E: "1"
      XCELSIOR_MCP_E2E_API_URL: http://127.0.0.1:18980
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install API and MCP dependencies
        run: |
          uv sync --frozen
          npm ci --prefix mcp
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Bootstrap real PostgreSQL and API
        run: |
          uv run alembic upgrade head
          uv run uvicorn api:app --host 127.0.0.1 --port 18980 > /tmp/xcelsior-mcp-api.log 2>&1 &
          echo $! > /tmp/xcelsior-mcp-api.pid
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18980/healthz >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/xcelsior-mcp-api.log
          exit 1
      - name: Thirteen-step SDK production journey
        working-directory: mcp
        run: npm test -- --run tests/e2e/real-stack.test.ts
      - name: API logs on failure
        if: failure()
        run: cat /tmp/xcelsior-mcp-api.log

name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.1.0). Leave blank to use tauri.conf.json version.'
        required: false
        type: string
      deploy:
        description: 'Upload binaries to downloads.xcelsior.ca'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: api/desktop

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            label: linux
          - os: macos-latest
            rust-target: aarch64-apple-darwin
            label: macos
          - os: windows-latest
            rust-target: x86_64-pc-windows-msvc
            label: windows
    runs-on: ${{ matrix.os }}
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # ── Linux dependencies ──────────────────────────────────────────
      - name: Install Linux desktop dependencies
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      # ── Toolchains ──────────────────────────────────────────────────
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: api/desktop/src-tauri

      # ── Version override ────────────────────────────────────────────
      - name: Set version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cd src-tauri
          jq --arg v "$VERSION" '.version = $v' tauri.conf.json > tmp.json
          mv tmp.json tauri.conf.json

      # ── Build ───────────────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      - name: Install cargo-tauri
        run: cargo install tauri-cli
        working-directory: .

      - name: Build desktop app
        run: cargo tauri build --target ${{ matrix.rust-target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Collect artifacts ───────────────────────────────────────────
      - name: Collect Linux artifacts
        if: matrix.label == 'linux'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/appimage/*.AppImage ../artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/deb/*.deb ../artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/rpm/*.rpm ../artifacts/ 2>/dev/null || true
          ls -lh ../artifacts/

      - name: Collect macOS artifacts
        if: matrix.label == 'macos'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/dmg/*.dmg ../artifacts/ 2>/dev/null || true
          ls -lh ../artifacts/

      - name: Collect Windows artifacts
        if: matrix.label == 'windows'
        shell: bash
        run: |
          mkdir -p ../artifacts
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/nsis/*.exe ../artifacts/ 2>/dev/null || true
          cp src-tauri/target/${{ matrix.rust-target }}/release/bundle/msi/*.msi ../artifacts/ 2>/dev/null || true
          ls -lh ../artifacts/

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-${{ matrix.label }}
          path: artifacts/*
          retention-days: 30

  # ── Release & Deploy ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    # The only job that writes: it creates the GitHub release. The workflow
    # default above is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Read version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ]; then
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(jq -r .version api/desktop/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lhR artifacts/
        working-directory: .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Xcelsior Desktop v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          files: artifacts/*
          generate_release_notes: true

      - name: Deploy to downloads.xcelsior.ca
        if: inputs.deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Upload all artifacts
          scp -i ~/.ssh/deploy_key artifacts/* "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"

          # Move into place
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" '
            sudo rm -f /var/www/downloads/desktop/*
            sudo mv /tmp/Xcelsior* /var/www/downloads/desktop/ 2>/dev/null || true
            sudo chmod 644 /var/www/downloads/desktop/*
            echo "Deployed:"
            ls -lh /var/www/downloads/desktop/
          '

          rm -f ~/.ssh/deploy_key
        working-directory: .

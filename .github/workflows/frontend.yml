name: Frontend CI

on:
  pull_request:
    paths:
      - 'frontend/**'
  push:
    branches: [main]

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  typecheck:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    needs: lint
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit

  build:
    runs-on: ubuntu-latest
    # Hosted Actions is blocked at the account level and is not expected to
    # be resolved. A job that fails on every push is worse than no job: it
    # trains everyone to ignore the CI column, which is where a real failure
    # would have to be noticed. Skipped rather than deleted — set the repo
    # variable HOSTED_ACTIONS=enabled to bring every one of these back at
    # once, with no diff to review.
    if: ${{ vars.HOSTED_ACTIONS == 'enabled' }}
    needs: [test, typecheck]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: https://xcelsior.ca
        run: npm run build
      - name: Verify standalone output
        run: test -f .next/standalone/server.js
      - name: Verify PWA output
        run: npm run verify:pwa
      - name: Install Chromium For PWA Smoke Test
        run: npx playwright install --with-deps chromium
      - name: Run PWA Smoke Test
        env:
          NEXT_PUBLIC_API_URL: https://xcelsior.ca
        run: npm run test:pwa:smoke
      - name: Run MCP Visual Regression
        env:
          NEXT_PUBLIC_API_URL: https://xcelsior.ca
        run: npm run test:mcp:visual

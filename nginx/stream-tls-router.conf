# TLS SNI router — the ONLY thing that binds 0.0.0.0:443 on this host.
#
# Include from the TOP LEVEL of /etc/nginx/nginx.conf, as a sibling of `http`,
# NOT from sites-enabled (which is included *inside* http):
#
#     include /etc/nginx/stream-tls-router.conf;
#
# Why this exists
# ---------------
# `agent.xcelsior.ca` must reach Envoy with the worker's client certificate
# intact. If nginx terminates TLS first the certificate is consumed and gone,
# which defeats the entire point of SPIFFE mTLS. But nginx also terminates TLS
# for six other vhosts on this same port, and those must not change.
#
# `stream` + `ssl_preread` is the standard way to have both: read the SNI from
# the ClientHello without terminating, then hand the raw TCP stream to whoever
# should own it. One vhost gets true passthrough; the rest carry on exactly as
# before, one hop further in.
#
# Real client IPs
# ---------------
# Passthrough means the backend's peer is 127.0.0.1. Every downstream vhost
# would log, rate-limit and geolocate against localhost — a silent behaviour
# change for six services. `proxy_protocol on` carries the true client address,
# and each http vhost restores it with:
#
#     set_real_ip_from 127.0.0.1;
#     real_ip_header   proxy_protocol;
#
# Both halves are required. The header alone without `set_real_ip_from` is
# ignored; `set_real_ip_from` without the backend expecting PROXY protocol
# makes nginx reject every request as a malformed one.

stream {
    map $ssl_preread_server_name $xcelsior_tls_backend {
        # PHASE B — the Envoy cutover is this ONE line. Change to 127.0.0.1:9443
        # once Envoy is up and proven against a real GPU host, and change it back
        # to 127.0.0.1:8444 to roll back. Until then worker traffic keeps using the
        # existing certificate-DN gateway in agent-xcelsior.conf, which is correct
        # and running with XCELSIOR_SPIFFE_STRICT=0.
        #
        # Do not flip this until Envoy's listener carries the proxy_protocol
        # listener filter — `proxy_protocol on` below applies to every backend, and
        # a listener that is not expecting it sees the PROXY header as garbage TLS.
        agent.xcelsior.ca   127.0.0.1:8444;

        # Everything else — xcelsior.ca, mcp, docs, downloads, hs, and the
        # default_server catch-all — terminates in nginx's http block as it always
        # has, just on 8444 instead of 443.
        #
        # 8444 and not 8443: Headscale already holds 127.0.0.1:8443 on this host.
        default             127.0.0.1:8444;
    }

    server {
        listen 443 reuseport;
        listen [::]:443 reuseport;

        # Read the SNI, terminate nothing.
        ssl_preread on;

        proxy_pass          $xcelsior_tls_backend;
        proxy_protocol      on;

        # Worker sessions are long-lived; the old http vhosts used 600s read
        # timeouts and Headscale holds streaming connections open.
        proxy_timeout       610s;
        proxy_connect_timeout 5s;
    }
}

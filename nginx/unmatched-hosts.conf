# The explicit owner of unmatched HTTPS traffic.
#
# **Why this file exists.** No server block on the production host declares
# `default_server`, so nginx falls back to the *first* block in config order —
# and the includes are globs (`sites-enabled/*`, `conf.d/*.conf`), which means
# the default is decided by **filename**. That is why `agent.xcelsior.ca`
# currently receives the `docs.xcelsior.ca` certificate: docs sorts first today.
#
# It is also a live hazard. `agent-xcelsior.conf` sorts ahead of every other
# vhost in this directory and ahead of every PixelEnhance hostname on that box.
# Symlinking it without this file would make an `ssl_verify_client on` block the
# implicit default, and it would then refuse **every unmatched hostname across
# both estates** — not misroute one, refuse all of them.
#
# Declaring one default explicitly removes the ordering question permanently,
# for both estates and for every hostname added later. A rename cannot defeat
# it and a new file cannot inherit it.
#
# **Named for what it does, not for where it sorts.** An earlier draft was
# `00-default-refuse.conf` — using the filename to win the ordering race, which
# is the same fragile mechanism this file exists to retire. Once one block
# declares `default_server`, position stops mattering and the name is free to
# be meaningful.
#
# **443 only, deliberately.** A `default_server` on :80 would capture ACME
# challenge traffic and the headscale HTTP vhost. The ordering hazard is on the
# TLS side, so the fix stays there.
#
# The certificate is whichever valid one the host already has — TLS is
# negotiated before the Host header is read, so an unmatched name necessarily
# gets *some* certificate and will see a name mismatch. That is correct and
# honest: the client is asking for a name this server does not serve. What
# changes is that it now gets a deterministic refusal instead of another site.

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Point at any valid certificate present on the host. This block never
    # serves content, so the name on the certificate does not matter — only
    # that the handshake can complete far enough to return the refusal.
    ssl_certificate     /etc/letsencrypt/live/docs.xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.xcelsior.ca/privkey.pem;

    # No client-certificate verification here. A default that required one
    # would reject unmatched traffic at the TLS layer, which is the failure this
    # file exists to prevent rather than a stricter version of preventing it.

    # 421 Misdirected Request: the request reached a server that cannot produce
    # a response for that authority. Plain, cheap, and not mistakable for an
    # outage of a real site.
    return 421;
}

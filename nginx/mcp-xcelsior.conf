# Canonical hosted MCP edge. The xcelsior.ca/mcp route remains compatibility
# only; this host has no marketing-page method switch.
upstream xcelsior_mcp_canonical {
    server 127.0.0.1:8770;
    server 127.0.0.1:8771 backup;
    keepalive 16;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mcp.xcelsior.ca;

    ssl_certificate /etc/letsencrypt/live/xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcelsior.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # RFC 9728 defines two locations for the same document: the bare
    # well-known path, and the path-inserted form derived from the resource
    # identifier (`https://mcp.xcelsior.ca/mcp` →
    # `/.well-known/oauth-protected-resource/mcp`). Clients differ on which
    # they try first, and a 404 on either reads as "this server has no OAuth"
    # — so both are proxied. The origin serves an identical body at both.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # OpenAI plugin domain verification. The portal fetches this and expects
    # the bare token it issued — so nothing may rewrite, wrap, or cache it.
    location = /.well-known/openai-apps-challenge {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_cache off;
    }

    location = /mcp {
        limit_req zone=xcelsior_limit burst=20 nodelay;
        client_max_body_size 1m;
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }
}

# cgroup v2 confinement for job steps on both nodes.
CgroupPlugin=cgroup/v2
ConstrainCores=yes
ConstrainRAMSpace=yes
ConstrainSwapSpace=yes
AllowedSwapSpace=0
# A job sees only the GPUs it was allocated. GPU-2 in the suite checks that
# a CPU-only job on the tower cannot open the RTX 3060.
ConstrainDevices=yes

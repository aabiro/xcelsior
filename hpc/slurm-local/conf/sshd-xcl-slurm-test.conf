# xcl-slurm-test: the Slurm adapter's service account on the tower.
# Installed as /etc/ssh/sshd_config.d/50-xcl-slurm-test.conf; this Match
# block ends with this file. Its one key lives in a root-owned file a job
# can't write, and every login runs the gate, whatever the client asks.
Match User @SVC_USER@
    AuthorizedKeysFile @AUTHKEYS@
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    ForceCommand @GATE@
    PermitTTY no
    PermitUserRC no
    AllowAgentForwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    X11Forwarding no
    PermitTunnel no

# Xcelsior local Slurm validation cluster: tower (controller + GPU node) and
# asus (CPU node), talking over the tailnet.
#
# TEST / RESEARCH ONLY. Not a production deployment.
# Plan and rollback: hpc/slurm-local/README.md
#
# Slurm 25.11 (Ubuntu 26.04 archive). The asus node runs config-less: its
# slurmd fetches this file, gres.conf and cgroup.conf from slurmctld.
# Values between @ signs are filled from site.env at install (scripts/lib.sh).

ClusterName=xcl-local
SlurmctldHost=tower(@TOWER_ADDR@)
SlurmctldParameters=enable_configless
AuthType=auth/munge
SlurmUser=slurm
SlurmctldPort=6817
SlurmdPort=6818
StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
SlurmctldDebug=info
SlurmdDebug=info

# ── Scheduling ──────────────────────────────────────────────────────
SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
GresTypes=gpu
# Refuse at submit time anything no partition/node can satisfy, instead
# of accepting it and leaving it pending forever. The adapter's failure-path
# tests (FAIL-*) depend on this.
EnforcePartLimits=ALL
# Finished jobs leave slurmctld memory after 60 s, then only sacct knows
# them. Short on purpose so the suite exercises the adapter's
# squeue → sacct fallback (LIFE-5) within a few minutes. Default is 300.
MinJobAge=60
# A node whose slurmd re-registers with a valid config returns to service
# on its own (the ASUS reboots without warning; see its pstore crashes).
ReturnToService=2
SlurmdTimeout=120
# ReturnToService=2 lets a node back in after any DOWN; this check runs on
# every node first (scripts/xcl-node-health): it drains a node whose jobs
# directory is wrong, and logs GPU processes Slurm can't see.
HealthCheckProgram=/usr/local/libexec/xcl-node-health
HealthCheckInterval=300
HealthCheckNodeState=ANY
# srun listens on these for its steps; the asus firewall admits them from
# the tower, so srun works on either node.
SrunPortRange=60001-60100
InactiveLimit=0
KillWait=30
Waittime=0
MpiDefault=none

# ── Preemption: a "spot" QoS that normal jobs requeue ───────────────
# Exercises the requeue and PREEMPTED paths the reconciler and billing
# must handle (sacct -D shows each run). 10-install-tower.sh creates the
# QoS: spot, with normal allowed to preempt it.
PreemptType=preempt/qos
PreemptMode=REQUEUE

# ── Process tracking and isolation (cgroup v2 on both nodes) ────────
ProctrackType=proctrack/cgroup
TaskPlugin=task/cgroup,task/affinity
JobAcctGatherType=jobacct_gather/cgroup
JobAcctGatherFrequency=30

# ── Accounting: slurmdbd on tower, MariaDB over its unix socket ─────
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=@TOWER_ADDR@
AccountingStoragePort=6819
# Record GPU allocations so sacct AllocTRES shows gres/gpu=N (metering).
AccountingStorageTRES=gres/gpu
# job_comment: sacct can find a job by the adapter's --comment tag.
# job_script: slurmdbd keeps every batch script, an audit trail for what
# the gate admitted (sacct --batch-script). Scripts can hold the job's
# extra_env, so the accounting DB is as sensitive as the scripts are.
AccountingStoreFlags=job_comment,job_script
JobCompType=jobcomp/none

# ── Nodes ───────────────────────────────────────────────────────────
# RealMemory (TOWER_MEM_MB / ASUS_MEM_MB in site.env) and MaxCPUsPerNode
# are deliberately far below the hardware so
# test jobs can never crowd out what already runs on these machines (tower:
# Docker services and GitHub runners; asus: the xcelsior worker).
# MaxCPUsPerNode caps all jobs of the partition together on each node (8
# CPUs), not each job; a second partition would get its own 8, so switch
# to CoreSpecCount on the node lines before adding one.
# The tower's RTX 3060 is shared: MPS, pxl-publisher, a GPU test worker and
# a Docker container use it outside Slurm, and Slurm can't see them.
# Typed GRES, like Alliance clusters ("gpu:h100:N"): Slurm matches the type
# as a substring of NVML's device name (nvidia_geforce_rtx_3060), so the
# adapter's typed request path is exercised exactly as it would be on Nibi.
NodeName=tower NodeAddr=@TOWER_ADDR@ CPUs=32 Boards=1 SocketsPerBoard=1 CoresPerSocket=16 ThreadsPerCore=2 RealMemory=@TOWER_MEM_MB@ Gres=gpu:rtx_3060:1 State=UNKNOWN
NodeName=asus NodeHostname=@ASUS_HOSTNAME@ NodeAddr=@ASUS_ADDR@ CPUs=16 Boards=1 SocketsPerBoard=1 CoresPerSocket=8 ThreadsPerCore=2 RealMemory=@ASUS_MEM_MB@ State=UNKNOWN

# ── One partition spanning both nodes ───────────────────────────────
PartitionName=xcl Nodes=tower,asus Default=YES MaxTime=01:00:00 DefaultTime=00:10:00 MaxCPUsPerNode=8 DefMemPerCPU=256 State=UP

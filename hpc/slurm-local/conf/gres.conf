# GPU GRES for the xcl-local cluster.
#
# tower: NVML discovers the RTX 3060 (device file, CPU affinity, links) and
#        names it nvidia_geforce_rtx_3060; slurm.conf's type "rtx_3060" is
#        matched as a substring of that name. With an untyped Gres=gpu:1
#        Slurm would drop the type ("Setting system GRES type to NULL").
#        Needs the slurm-wlm-nvml-plugin package.
# asus:  CPU-only in this cluster. Its RTX 2060 is never offered.
NodeName=tower AutoDetect=nvml
NodeName=asus AutoDetect=off

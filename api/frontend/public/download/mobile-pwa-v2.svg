<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" fill="none">
  <!-- Same vocabulary as features/*.svg: panel gradient, thin brand edge,
       card shadow, violet bloom, placeholder bars instead of words. -->
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22e0ff"/>
      <stop offset="48%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16233c"/>
      <stop offset="100%" stop-color="#0b1322"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1b2740"/>
      <stop offset="100%" stop-color="#070b15"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="24%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#5eeaff"/>
      <stop offset="42%" stop-color="#2a8cff"/>
      <stop offset="100%" stop-color="#0b1b3a"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bloom" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <circle cx="122" cy="150" r="56" fill="#7c3aed" filter="url(#bloom)" opacity="0.24"/>
  <circle cx="196" cy="380" r="44" fill="#22e0ff" filter="url(#bloom)" opacity="0.12"/>
  <g filter="url(#cardShadow)">
    <!-- device -->
    <rect x="40" y="20" width="220" height="480" rx="36" fill="url(#panel)" stroke="url(#brand)" stroke-width="1.5"/>
    <rect x="52" y="32" width="196" height="456" rx="27" fill="url(#spot)"/>
    <rect x="124" y="42" width="52" height="10" rx="5" fill="#05080f"/>
    <!-- header -->
    <path d="M70 76 L82 92 M82 76 L70 92" stroke="url(#brand)" stroke-width="3" stroke-linecap="round"/>
    <rect x="92" y="80" width="54" height="8" rx="4" fill="#7cf2ff" opacity="0.55"/>
    <circle cx="226" cy="84" r="8" fill="#16233c" stroke="#22e0ff" stroke-opacity="0.35"/>
    <!-- wallet tile -->
    <rect x="66" y="108" width="168" height="72" rx="14" fill="url(#panel)" stroke="#22324d"/>
    <rect x="80" y="122" width="40" height="6" rx="3" fill="#7cf2ff" opacity="0.45"/>
    <rect x="80" y="140" width="84" height="16" rx="5" fill="#e8eef9" opacity="0.9"/>
    <rect x="176" y="146" width="44" height="18" rx="9" fill="url(#brand)"/>
    <!-- instance rows -->
    <g>
      <rect x="66" y="194" width="168" height="44" rx="12" fill="url(#panel)" stroke="#22324d"/>
      <rect x="78" y="205" width="22" height="22" rx="6" fill="url(#core)"/>
      <rect x="110" y="208" width="58" height="6" rx="3" fill="#e8eef9" opacity="0.8"/>
      <rect x="110" y="220" width="38" height="5" rx="2.5" fill="#7cf2ff" opacity="0.4"/>
      <circle cx="220" cy="216" r="4" fill="#34d399" filter="url(#glow)"/>
    </g>
    <g>
      <rect x="66" y="246" width="168" height="44" rx="12" fill="url(#panel)" stroke="#22324d"/>
      <rect x="78" y="257" width="22" height="22" rx="6" fill="url(#violet)"/>
      <rect x="110" y="260" width="48" height="6" rx="3" fill="#e8eef9" opacity="0.8"/>
      <rect x="110" y="272" width="30" height="5" rx="2.5" fill="#7cf2ff" opacity="0.4"/>
      <circle cx="220" cy="268" r="4" fill="#34d399" filter="url(#glow)"/>
    </g>
    <!-- utilisation -->
    <rect x="66" y="302" width="168" height="104" rx="14" fill="url(#panel)" stroke="#22324d"/>
    <rect x="80" y="316" width="46" height="6" rx="3" fill="#7cf2ff" opacity="0.45"/>
    <circle cx="220" cy="319" r="4" fill="#34d399" filter="url(#glow)"/>
    <path d="M80,384 L98,370 L114,376 L132,354 L150,362 L168,342 L186,350 L204,334 L220,338" stroke="url(#brand)" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <path d="M80,394 L110,390 L140,392 L172,386 L220,384" stroke="#34d399" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.7"/>
    <!-- tab bar -->
    <rect x="66" y="426" width="168" height="40" rx="20" fill="url(#panel)" stroke="#22324d"/>
    <circle cx="96" cy="446" r="5" fill="#22e0ff" filter="url(#glow)"/>
    <circle cx="131" cy="446" r="4" fill="#7cf2ff" opacity="0.3"/>
    <circle cx="166" cy="446" r="4" fill="#7cf2ff" opacity="0.3"/>
    <circle cx="201" cy="446" r="4" fill="#7cf2ff" opacity="0.3"/>
    <rect x="40" y="20" width="220" height="480" rx="36" fill="url(#glass)"/>
  </g>
</svg>

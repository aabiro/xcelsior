<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xcelsior · Particle Field</title>
<style>
  html,body{margin:0;height:100%;background:#0a0f1a;overflow:hidden}
  /* subtle radial ambience under the particles */
  #stage{position:fixed;inset:0;background:
    radial-gradient(60% 60% at 78% 18%, rgba(155,109,255,.10), transparent 70%),
    radial-gradient(55% 55% at 15% 88%, rgba(56,219,255,.08), transparent 70%),
    #0a0f1a;}
  canvas{position:fixed;inset:0;display:block}
  .cap{position:fixed;left:24px;bottom:20px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    color:#5b6b82;letter-spacing:2px;text-transform:uppercase;z-index:2}
</style>
</head>
<body>
<div id="stage"></div>
<canvas id="c"></canvas>
<div class="cap">Xcelsior · agent-native compute — floating field demo</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// subtle mouse parallax — near particles shift more than far ones
let mx = 0, my = 0, tmx = 0, tmy = 0;
window.addEventListener('pointermove', e => {
  tmx = (e.clientX / W - 0.5) * 2;   // -1 … 1
  tmy = (e.clientY / H - 0.5) * 2;
});
window.addEventListener('pointerleave', () => { tmx = 0; tmy = 0; });

// load the premium orb sprites (site colors)
const srcs = ['uploads/particle-cyan.svg','uploads/particle-purple.svg','uploads/particle-emerald.svg'];
// weight cyan/purple more than emerald for a cohesive palette
const weights = [0.42, 0.42, 0.16];
const imgs = srcs.map(s => { const i = new Image(); i.src = s; return i; });

const COUNT = Math.round(Math.min(90, Math.max(38, (W*H)/22000)));
function pick(){ const r=Math.random(); let a=0; for(let k=0;k<weights.length;k++){a+=weights[k]; if(r<=a) return k;} return 0; }
function rnd(a,b){ return a + Math.random()*(b-a); }

const parts = Array.from({length: COUNT}, () => {
  const depth = Math.random();               // 0 far … 1 near (parallax)
  const size = rnd(8, 34) * (0.5 + depth);
  return {
    x: Math.random()*W, y: Math.random()*H,
    vx: rnd(-0.14,0.14) * (0.4+depth),
    vy: rnd(-0.14,0.14) * (0.4+depth),
    size, depth,
    img: pick(),
    a: rnd(0.25, 0.9) * (0.45+depth*0.6),     // base opacity
    ph: Math.random()*Math.PI*2,              // pulse phase
    ps: rnd(0.0006, 0.0016)                   // pulse speed
  };
});

let t = 0;
function frame(now){
  t = now || 0;
  ctx.clearRect(0,0,W,H);
  mx += (tmx - mx) * 0.05; my += (tmy - my) * 0.05;   // ease toward target
  ctx.globalCompositeOperation = 'lighter';   // additive glow for premium feel
  for(const p of parts){
    p.x += p.vx; p.y += p.vy;
    const m = p.size;                          // wrap softly around edges
    if(p.x < -m) p.x = W+m; if(p.x > W+m) p.x = -m;
    if(p.y < -m) p.y = H+m; if(p.y > H+m) p.y = -m;
    const pulse = 0.72 + 0.28*Math.sin(p.ph + t*p.ps);
    const par = 26 * p.depth;                  // parallax offset by depth
    const dx = p.x + mx * par, dy = p.y + my * par;
    const im = imgs[p.img];
    if(im.complete && im.naturalWidth){
      ctx.globalAlpha = Math.min(1, p.a * pulse);
      const s = p.size * (0.9 + 0.1*pulse);
      ctx.drawImage(im, dx - s/2, dy - s/2, s, s);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

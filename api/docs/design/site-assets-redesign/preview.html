<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body{margin:0;font-family:ui-monospace,monospace;background:#0a0f1a}
.wrap{display:flex;flex-wrap:wrap}
.cell{padding:20px;display:flex;flex-direction:column;align-items:center;gap:8px}
.light{background:#eef2f7}.dark{background:#0b1220}
.hero img{width:520px;max-width:46vw;height:auto}
.og{width:100%;background:#0a0f1a}.og img{width:840px;max-width:92vw;height:auto;border:1px solid #1e293b}
.orbs{width:100%;background:#0a0f1a;justify-content:center;flex-direction:row;gap:40px}
.orbs img{width:90px;height:90px}
span{font-size:11px;color:#64748b}.dark span,.og span,.orbs span{color:#94a3b8}
</style></head><body>
<div class="wrap">
  <div class="cell hero light"><img src="uploads/mcp-agent.light.svg"><span>mcp-agent.light</span></div>
  <div class="cell hero dark"><img src="uploads/mcp-agent.dark.svg"><span>mcp-agent.dark</span></div>
</div>
<div class="cell og"><img src="uploads/og-agent-native.svg"><span>og-agent-native.svg · 1200×630</span></div>
<div class="cell orbs">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><img src="uploads/particle-cyan.svg"><span>cyan</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><img src="uploads/particle-purple.svg"><span>purple</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px"><img src="uploads/particle-emerald.svg"><span>emerald</span></div>
</div>
</body></html>

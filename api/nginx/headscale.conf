# Headscale HTTPS Nginx Configuration
# Deploy to: /etc/nginx/sites-available/headscale
# Enable with: ln -s /etc/nginx/sites-available/headscale /etc/nginx/sites-enabled/
#
# **This host now serves `hs.xcelsior.ca` directly** (2026-08-29). It previously
# sat behind 45.76.3.128, which held the public certificate, terminated TLS and
# proxied here with `proxy_ssl_verify off` — so this end only needed transport
# encryption and carried a ten-year self-signed cert on purpose.
#
# That front was a single point of failure, and it failed: when 45.76.3.128 went
# dark on 2026-08-19 the whole tailnet control plane became unreachable while
# Headscale itself, here, was healthy the entire time. Removing the front means
# clients now authenticate this endpoint themselves, which is exactly the
# condition the old comment named as the trigger for replacing the certificate:
# it could not chain to a public root.
#
# So the certificate is Let's Encrypt, issued **on this host** by DNS-01
# (`certbot --dns-cloudflare`). DNS-01 rather than HTTP-01 is deliberate and is
# the fix for the failure that killed the previous ACME entry: an HTTP challenge
# is answered by whichever host the A record points at, not by the one holding
# the certificate, so the old entry failed to renew every day and that noise
# masked four real renewal failures found on 2026-08-08. A DNS challenge does
# not care where the record points — it worked before the cutover and keeps
# working after.
#
# Order matters if this is ever redone: issue the certificate, repoint this
# file, verify with `curl --resolve hs.xcelsior.ca:443:<this-ip>`, and only then
# move DNS. Moving DNS first serves a name this box cannot yet prove.

server {
    listen 8444 ssl http2 proxy_protocol;
    # Behind the stream TLS router (nginx/stream-tls-router.conf), so the
    # peer address is 127.0.0.1. Without these two lines every log line,
    # rate limit and geo lookup in this vhost would see localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   proxy_protocol;
    server_name hs.xcelsior.ca;

    ssl_certificate /etc/letsencrypt/live/hs.xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.xcelsior.ca/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

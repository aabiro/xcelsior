# Canonical hosted MCP edge. The xcelsior.ca/mcp route remains compatibility
# only; this host has no marketing-page method switch.
upstream xcelsior_mcp_canonical {
    server 127.0.0.1:8770;
    server 127.0.0.1:8771 backup;
    keepalive 16;
}

server {
    listen 8444 ssl proxy_protocol;
    listen [::]:8444 ssl proxy_protocol;
    http2 on;
    # Behind the stream TLS router (nginx/stream-tls-router.conf), so the
    # peer address is 127.0.0.1. Without these two lines every log line,
    # rate limit and geo lookup in this vhost would see localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   proxy_protocol;
    server_name mcp.xcelsior.ca;
    include /etc/nginx/snippets/xcelsior-abuse-deny*.conf;

    ssl_certificate /etc/letsencrypt/live/xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcelsior.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # RFC 9728 defines two locations for the same document: the bare
    # well-known path, and the path-inserted form derived from the resource
    # identifier (`https://mcp.xcelsior.ca/mcp` →
    # `/.well-known/oauth-protected-resource/mcp`). Clients differ on which
    # they try first, and a 404 on either reads as "this server has no OAuth"
    # — so both are proxied. The origin serves an identical body at both.
    location = /.well-known/oauth-protected-resource {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout;
    }

    location = /.well-known/oauth-protected-resource/mcp {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout;
    }

    # OpenAI plugin domain verification. The portal fetches this and expects
    # the bare token it issued — so nothing may rewrite, wrap, or cache it.
    location = /.well-known/openai-apps-challenge {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout;
        proxy_cache off;
    }

    # Authorization-server metadata (RFC 8414) at the MCP origin. Clients that
    # predate protected-resource discovery look for it beside the resource
    # rather than at the issuer; the API answers for xcelsior.ca, the issuer.
    location = /.well-known/oauth-authorization-server {
        proxy_pass http://xcelsior_api;
        proxy_http_version 1.1;
        proxy_set_header Host xcelsior.ca;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_cache off;
    }

    # resource_policy_uri / resource_tos_uri in the protected-resource
    # document can be followed from this host.
    location = /privacy { return 302 https://xcelsior.ca/privacy; }
    location = /terms { return 302 https://xcelsior.ca/terms; }

    # The server icon advertised in serverInfo.icons. Clients only accept an
    # HTTP server's icon from the server's own origin, so it cannot live on
    # xcelsior.ca — it has to resolve here.
    location = /icon.png {
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout;
    }

    location = /mcp {
        # Browser-based MCP clients. The origin sets no CORS headers, so the
        # edge answers preflight itself. A location with its own add_header
        # inherits none from the server block, hence HSTS is restated.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Mcp-Session-Id, MCP-Protocol-Version" always;
        add_header Access-Control-Expose-Headers "Mcp-Session-Id, WWW-Authenticate" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        if ($request_method = OPTIONS) { return 204; }

        limit_req zone=xcelsior_limit burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 1m;
        proxy_pass http://xcelsior_mcp_canonical;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Mcp-Session-Id $http_mcp_session_id;
        proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
        proxy_set_header traceparent $http_traceparent;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 60s;
        proxy_next_upstream off;
    }
}

# Install on the dedicated Xcelsior ingress after moving the other sites and
# removing their defaults. The TLS listener is behind stream-tls-router.conf.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 404;
}

server {
    listen 8444 ssl default_server proxy_protocol;
    listen [::]:8444 ssl default_server proxy_protocol;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header proxy_protocol;
    server_name _;

    ssl_reject_handshake on;
    return 421;
}

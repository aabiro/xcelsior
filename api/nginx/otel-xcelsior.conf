# otel.xcelsior.ca — public OTLP/HTTP log ingest for Claude Cowork
#
# Cowork's exporter runs in the Cowork VM (on a user's machine, or on
# Anthropic's servers for cloud sessions), so it can only reach a public,
# authenticated endpoint. This vhost is that endpoint and nothing else:
#
#   * only `POST /v1/logs` — Cowork exports events over the OTLP logs protocol
#     and no metrics or traces, so the collector's other signal paths stay
#     private;
#   * a bearer token compared here, before anything reaches the collector;
#   * proxied to the host-local collector receiver (127.0.0.1:4318), whose
#     logs pipeline already writes to Loki.
#
# The token is host-owned state, never in the repo: see
# snippets/otel-ingest-token.conf.example. With no snippet installed the
# variable stays empty and every request is refused with 503, so this file is
# safe to install before the token exists.
#
# Admin settings > Cowork:  endpoint https://otel.xcelsior.ca
#                           protocol http/protobuf
#                           headers  Authorization=Bearer <token>

limit_req_zone $binary_remote_addr zone=otel_ingest:10m rate=20r/s;

# HTTP → HTTPS redirect (+ ACME challenge)
server {
    listen 80;
    listen [::]:80;
    server_name otel.xcelsior.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8444 ssl http2 proxy_protocol;
    listen [::]:8444 ssl http2 proxy_protocol;
    # Behind the stream TLS router (nginx/stream-tls-router.conf), so the
    # peer address is 127.0.0.1. Without these two lines every log line,
    # rate limit and geo lookup in this vhost would see localhost.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header   proxy_protocol;
    server_name otel.xcelsior.ca;

    include /etc/nginx/snippets/xcelsior-abuse-deny*.conf;

    ssl_certificate /etc/letsencrypt/live/otel.xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/otel.xcelsior.ca/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:OtelSSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Written on the host by an operator; see the .example file for how.
    set $xcelsior_otel_ingest_token "";
    include /etc/nginx/snippets/otel-ingest-token.conf*;

    location = /v1/logs {
        limit_except POST { deny all; }
        if ($xcelsior_otel_ingest_token = "") { return 503; }
        if ($http_authorization != "Bearer $xcelsior_otel_ingest_token") { return 401; }

        limit_req zone=otel_ingest burst=40 nodelay;
        limit_req_status 429;
        # The OTel SDK's default batch is 512 records; tool inputs cap at ~4 KB
        # and responses at 60 KB, so a full batch stays well under this.
        client_max_body_size 16m;

        proxy_pass http://127.0.0.1:4318;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        # The collector never sees the shared token.
        proxy_set_header Authorization "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}

# yaml-language-server: $schema=https://schema.buildwithfern.dev/generators-yml.json
api:
  specs:
    - openapi: openapi.json
      overrides: openapi-overrides.yml
readme:
  apiName: Xcelsior Compute API
  apiReferenceLink: https://docs.xcelsior.ca/api-reference
  introduction: >-
    A typed TypeScript client for Xcelsior's public compute API. It supports
    Node.js and browser applications, configurable authentication, retries,
    timeouts, and custom fetch implementations.
  exampleStyle: minimal
default-group: local
groups:
  local:
    generators:
      - name: fern-typescript-sdk
        output:
          location: local-file-system
          path: ../frontend/sdk
        version: 3.59.11
        config:
          bundle: true
  publish:
    generators:
      - name: fern-typescript-sdk
        output:
          location: npm
          package-name: "@xcelsior-gpu/sdk"
          token: ${NPM_TOKEN}
        version: 3.59.11
        config:
          bundle: true
          packageJson:
            description: Typed TypeScript SDK for the Xcelsior Compute API
            license: MIT
            homepage: https://docs.xcelsior.ca
            repository:
              type: git
              url: git+https://github.com/aabiro/xcelsior.git
              directory: api/frontend/sdk
            keywords:
              - xcelsior
              - gpu
              - compute
              - api
            publishConfig:
              access: public

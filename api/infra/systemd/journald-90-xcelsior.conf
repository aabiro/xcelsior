# Installed as /etc/systemd/journald.conf.d/90-xcelsior.conf on prod-hetzner.
# A drop-in overrides /etc/systemd/journald.conf (which still says 200M), and it
# survives a package upgrade replacing that file.
#
# Measured 2026-11-24: the system journal grows about 450 MB a day (one 16.8 MB
# file every ~54 min; most of it ssh/logind noise and the test workers). At the
# old 200M cap it held about 15 hours, so a rollout gate read empty logs for the
# days it was checking. 8G keeps about 17 days at that rate.
#
# SystemKeepFree=30G: journald stops growing while / has less than 30 GB free,
# which is 20% of the 150 GB disk, so the journal alone never takes / past the
# 80% XcelsiorProdDiskHigh warning.
[Journal]
SystemMaxUse=8G
SystemKeepFree=30G

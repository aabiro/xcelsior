# Nginx front for a promoted Headscale standby.
# Install as /etc/nginx/sites-available/headscale on the standby host
# (api/infra/headscale/standby-setup.sh does this).
# hs.xcelsior.ca must remain DNS-only (grey cloud). TLS is transport, not a
# second identity — clients already trust https://hs.xcelsior.ca.
#
# The standby's Headscale is stopped until `headscale-failover promote`, so this
# answers 502 in steady state. That is expected: promote restarts Headscale and
# then requires /health through this front before it moves DNS.

server {
    listen 80;
    server_name hs.xcelsior.ca;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 443 on this host is forwarded from the home router so a promoted standby can
# be reached. Nothing else is served here: any other name is refused at the TLS
# handshake rather than handed this certificate.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hs.xcelsior.ca;

    # Issued by DNS-01 (Cloudflare), so it exists and renews while the name
    # still points at the primary.
    ssl_certificate /etc/letsencrypt/live/hs.xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.xcelsior.ca/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        # The replicated (primary) config listens here; see config.yaml listen_addr.
        proxy_pass http://127.0.0.1:8443;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}

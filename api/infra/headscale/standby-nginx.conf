# Nginx front for a promoted Headscale standby.
# Install as /etc/nginx/sites-available/headscale on the standby host.
# hs.xcelsior.ca must remain DNS-only (grey cloud). TLS is transport, not a
# second identity — clients already trust https://hs.xcelsior.ca.

server {
    listen 80;
    server_name hs.xcelsior.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name hs.xcelsior.ca;

    ssl_certificate /etc/letsencrypt/live/hs.xcelsior.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hs.xcelsior.ca/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
